    // Helper to create rich CSP-safe SVG data URI banners for activities
    function createBannerSvg(bg1, bg2, emoji, label, sublabel) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${bg1}"/>
            <stop offset="100%" stop-color="${bg2}"/>
          </linearGradient>
        </defs>
        <rect width="600" height="280" fill="url(#g)"/>
        <circle cx="520" cy="60" r="110" fill="rgba(255,255,255,0.08)"/>
        <circle cx="80" cy="230" r="90" fill="rgba(255,255,255,0.06)"/>
        <text x="480" y="160" font-size="95" text-anchor="middle" opacity="0.28">${emoji}</text>
        <text x="32" y="120" font-family="sans-serif" font-size="22" font-weight="800" fill="rgba(255,255,255,0.92)">${label}</text>
        <text x="32" y="148" font-family="sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.75)">${sublabel}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function createAvatarSvg(bg, initials) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
        <rect width="120" height="120" rx="60" fill="${bg}"/>
        <text x="60" y="72" font-family="sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">${initials}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

      toast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const el = document.createElement('div');
        const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'info' ? 'bg-indigo-600 text-white' : 'bg-rose-600 text-white';
        el.className = `${bg} px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 text-xs font-bold pointer-events-auto transition-all`;
        el.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-white animate-ping shrink-0"></span>
          <span class="flex-1">${message}</span>
          <button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100 text-white ml-2">✕</button>
        `;
        container.appendChild(el);
        setTimeout(() => {
          if (el && el.parentElement) el.remove();
        }, 3500);
      }

      render() {
        const container = document.getElementById('screen-container');
        if (!container) return;

        this.updateNavHighlight();

        switch (this.currentScreen) {
          case 'onboarding':
            container.innerHTML = this.renderOnboarding();
            break;
          case 'home':
            container.innerHTML = this.renderHome();
            break;
          case 'explore':
            container.innerHTML = this.renderExplore();
            break;
          case 'create':
            container.innerHTML = this.renderCreate();
            break;
          case 'inbox':
            container.innerHTML = this.renderInbox();
            break;
          case 'profile':
            container.innerHTML = this.renderProfile();
            break;
          case 'details':
            container.innerHTML = this.renderDetails();
            break;
          case 'vibe':
            container.innerHTML = this.renderVibe();
            break;
          case 'subscription':
            container.innerHTML = this.renderSubscription();
            break;
          case 'settings':
            container.innerHTML = this.renderSettings();
            break;
          default:
            container.innerHTML = this.renderHome();
        }
        container.scrollTop = 0;
      }

      updateNavHighlight() {
        const navButtons = document.querySelectorAll('.nav-item');
        navButtons.forEach(btn => {
          btn.classList.remove('text-indigo-600', 'font-bold');
          btn.classList.add('text-slate-500');
        });

        const map = {
          home: 'nav-btn-home',
          explore: 'nav-btn-explore',
          inbox: 'nav-btn-inbox',
          profile: 'nav-btn-profile'
        };
        const activeId = map[this.currentScreen];
        if (activeId) {
          const el = document.getElementById(activeId);
          if (el) {
            el.classList.add('text-indigo-600', 'font-bold');
            el.classList.remove('text-slate-500');
          }
        }

        const bottomNav = document.getElementById('bottom-nav');
        if (bottomNav) {
          bottomNav.style.display = this.currentScreen === 'onboarding' ? 'none' : 'flex';

                  <span class="font-semibold text-slate-700">${act.organiser.name}</span>
                  <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">★ ${act.organiser.reliabilityScore}</span>
                </div>
                <div class="font-extrabold text-indigo-700">
                  ${act.estimatedContribution === 0 ? 'Free' : 'RM' + act.estimatedContribution + ' est.'}
                </div>

              <div class="pt-1 flex items-center gap-2">
                ${isJoined ? `
                  <button onclick="event.stopPropagation(); app.openActivityDetails('${act.id}')" class="flex-1 py-2 px-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-xs">
                    ✓ Joined Session (View Details)
                  </button>
                  ${act.needsReplacement ? `
                    <button onclick="event.stopPropagation(); app.openReplacementHub('${act.id}')" class="py-2 px-3 rounded-xl bg-rose-600 text-white font-bold text-xs">
                      Manage Replacement (${act.replacementDetails?.applicants?.length || 0})
                    </button>
                  ` : ''}
                ` : `
                  <button onclick="event.stopPropagation(); app.initiateJoin('${act.id}')" class="w-full py-2.5 px-3 rounded-xl ${isUrgent ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white font-bold text-xs shadow-sm transition">
                    ${isUrgent ? '⚡ Join as Replacement (' + remainingSlots + ' slot left)' : 'Join Activity'}
                  </button>

            </div>

        `;

      // SCREEN C: Explore Activities
      renderExplore() {
        let filtered = this.activities.filter(a => {
          if (this.exploreFilters.searchQuery) {
            const q = this.exploreFilters.searchQuery.toLowerCase();
            if (!a.title.toLowerCase().includes(q) && !a.venue.toLowerCase().includes(q) && !a.categoryLabel.toLowerCase().includes(q)) {
              return false;
            }
          }
          if (this.exploreFilters.category !== 'all' && a.category !== this.exploreFilters.category) return false;
          if (this.exploreFilters.budget === 'free' && a.estimatedContribution > 0) return false;
          if (this.exploreFilters.budget === 'under10' && a.estimatedContribution > 10) return false;
          if (this.exploreFilters.onlyReplacements && !a.needsReplacement) return false;
          return true;
        });

        if (this.exploreFilters.sortBy === 'slots') {
          filtered.sort((a, b) => (b.maxParticipants - b.currentParticipants) - (a.maxParticipants - a.currentParticipants));
        }

        return `
          <div class="p-4 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-extrabold text-slate-900">Explore UMS Activities</h2>
              <span class="text-xs font-bold text-slate-500">${filtered.length} results</span>
            </div>

            <div class="relative">
              <input 
                type="text" 
                value="${this.exploreFilters.searchQuery}"
                oninput="app.handleSearchInput(this.value)"
                placeholder="Search futsal, badminton, library, ODEC..." 
                class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 shadow-sm"
              />
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              <button onclick="app.toggleReplacementFilter()" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${this.exploreFilters.onlyReplacements ? 'bg-rose-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
                ⚡ Vacant Replacement Slots
              </button>
              <button onclick="app.setExploreCategory('all')" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'all' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">All</button>
              <button onclick="app.setExploreCategory('futsal')" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'futsal' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">⚽ Futsal</button>
              <button onclick="app.setExploreCategory('badminton')" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'badminton' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">🏸 Badminton</button>
              <button onclick="app.setExploreCategory('basketball')" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'basketball' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">🏀 Basketball</button>
              <button onclick="app.setExploreCategory('running')" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'running' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">🏃 Run/Gym</button>
              <button onclick="app.setExploreCategory('study')" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'study' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">📚 Study</button>
              <button onclick="app.setExploreCategory('hangout')" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'hangout' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">☕ Hangout</button>
            </div>

            <div class="flex items-center justify-between bg-white border border-slate-200 rounded-2xl p-2.5 text-xs">
              <div class="flex items-center gap-1.5">
                <span class="text-slate-400 font-semibold">Sort:</span>
                <select onchange="app.setSortBy(this.value)" class="font-bold text-slate-800 bg-transparent focus:outline-none">
                  <option value="recommended" ${this.exploreFilters.sortBy === 'recommended' ? 'selected' : ''}>Recommended</option>
                  <option value="soonest" ${this.exploreFilters.sortBy === 'soonest' ? 'selected' : ''}>Starting Soon</option>
                  <option value="slots" ${this.exploreFilters.sortBy === 'slots' ? 'selected' : ''}>Most Available</option>
                </select>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-slate-400 font-semibold">Budget:</span>
                <select onchange="app.setBudgetFilter(this.value)" class="font-bold text-slate-800 bg-transparent focus:outline-none">
                  <option value="all" ${this.exploreFilters.budget === 'all' ? 'selected' : ''}>All Budgets</option>
                  <option value="free" ${this.exploreFilters.budget === 'free' ? 'selected' : ''}>Free (RM0)</option>
                  <option value="under10" ${this.exploreFilters.budget === 'under10' ? 'selected' : ''}>Under RM10</option>
                </select>
              </div>
            </div>

            <div class="space-y-3">
              ${filtered.length > 0 ? (
                filtered.map(act => this.renderActivityCard(act, act.needsReplacement)).join('')
              ) : `
                <div class="bg-white border border-slate-200 rounded-3xl p-8 text-center space-y-3">
                  <div class="text-3xl">🔍</div>
                  <h3 class="font-bold text-slate-800 text-sm">No matching activities found</h3>
                  <p class="text-xs text-slate-500">Try resetting your filters or create a new activity for UMS students!</p>
                  <button onclick="app.resetFilters()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Reset Filters</button>
                </div>
              `}
            </div>
          </div>
        `;
      }

      // SCREEN D: Activity Details & Replacement Actions
      renderDetails() {
        const act = this.activities.find(a => a.id === this.selectedActivityId) || this.activities[0];
        const isSaved = this.user.savedActivityIds.includes(act.id);
        const isJoined = act.isJoined || this.user.joinedActivityIds.includes(act.id);

        return `
          <div class="space-y-4">
            <div class="h-48 w-full relative bg-slate-900">
              <img src="${act.imageUrl}" class="w-full h-full object-cover" alt="${act.title}" />
              <div class="absolute top-3 left-3 right-3 flex items-center justify-between">
                <button onclick="navigateTo('home')" class="px-3 py-1.5 rounded-full bg-white/90 text-slate-800 font-bold text-xs shadow">
                  ← Back
                </button>
                <div class="flex items-center gap-2">
                  <button onclick="app.toggleSaveActivity('${act.id}')" class="px-3 py-1.5 rounded-full bg-white/90 text-slate-800 font-bold text-xs shadow">
                    ${isSaved ? '❤️ Saved' : '🤍 Save'}
                  </button>
                  <button onclick="app.showReportModal('${act.id}')" class="px-3 py-1.5 rounded-full bg-white/90 text-rose-700 font-bold text-xs shadow">
                    ⚑ Report
                  </button>
                </div>
              </div>
              <div class="absolute bottom-3 left-4 right-4 text-white">
                <div class="flex items-center gap-2 mb-1">
                  <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-0.5 rounded-full">${act.categoryLabel}</span>
                  ${act.needsReplacement ? `<span class="bg-rose-600 text-white text-xs font-bold px-2.5 py-0.5 rounded-full">⚡ Replacement Needed</span>` : ''}
                </div>
                <h1 class="text-lg font-extrabold text-white">${act.title}</h1>
              </div>
            </div>

            <div class="px-4 space-y-3.5">
              <!-- Last-Minute Replacement Banner -->
              ${act.needsReplacement ? `
                <div class="bg-rose-50 border border-rose-200 rounded-3xl p-4 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-extrabold text-rose-900">⚡ Urgent Replacement Slot Open</span>
                    <span class="text-xs font-bold bg-rose-200 text-rose-900 px-2 py-0.5 rounded-full">${act.replacementDetails?.deadlineMinutes || 30}m left</span>
                  </div>
                  <p class="text-xs text-rose-800">
                    <strong>Reason:</strong> ${act.replacementDetails?.reason || 'Last-minute participant cancellation'}.
                  </p>
                  <div class="flex items-center gap-2 pt-1">
                    <button onclick="app.openReplacementHub('${act.id}')" class="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">
                      Open Replacement Matching Hub (${act.replacementDetails?.applicants?.length || 0} applicants) →
                    </button>
                  </div>
                </div>
              ` : `
                <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3 flex items-center justify-between text-xs">
                  <span class="font-semibold text-indigo-900">Someone cancelled last minute?</span>
                  <button onclick="app.publishNewReplacementRequest('${act.id}')" class="font-bold text-white bg-indigo-600 px-3 py-1.5 rounded-xl">
                    + Find a Replacement
                  </button>
                </div>
              `}

              <!-- Organiser Info -->
              <div class="bg-white border border-slate-200 rounded-3xl p-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <img src="${act.organiser.avatar}" class="w-11 h-11 rounded-2xl" alt="org" />
                  <div>
                    <h4 class="font-bold text-slate-900 text-xs">${act.organiser.name} <span class="text-indigo-600">(Organiser)</span></h4>
                    <p class="text-xs text-slate-500">${act.organiser.faculty}</p>
                  </div>
                </div>
                <div class="text-right">
                  <span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-200 block">
                    ★ ${act.organiser.reliabilityScore}/100
                  </span>
                </div>
              </div>

              <!-- Key Activity Details -->
              <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-2.5 text-xs">
                <div class="flex justify-between py-1 border-b border-slate-100">
                  <span class="text-slate-500">Date &amp; Time:</span>
                  <span class="font-bold text-slate-900">${act.date}, ${act.time} - ${act.endTime}</span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-100">
                  <span class="text-slate-500">Venue:</span>
                  <span class="font-bold text-slate-900">${act.venue}</span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-100">
                  <span class="text-slate-500">Skill Level:</span>
                  <span class="font-bold text-slate-900">${act.skillLevelLabel}</span>
                </div>
                <div class="flex justify-between py-1">
                  <span class="text-slate-500">Estimated Contribution:</span>
                  <span class="font-extrabold text-indigo-700">${act.estimatedContribution === 0 ? 'Free (RM0)' : 'RM' + act.estimatedContribution + ' / pax'}</span>
                </div>
                <p class="text-xs text-slate-500 bg-slate-50 p-2 rounded-xl">${act.contributionNote}</p>
              </div>

              <!-- Description & Cancellation -->
              <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-2 text-xs">
                <h4 class="font-bold text-slate-900">Activity Description</h4>
                <p class="text-slate-600 leading-relaxed">${act.description}</p>
                <div class="pt-2 border-t border-slate-100 text-slate-500">
                  <strong>Cancellation Policy:</strong> ${act.cancellationPolicy}
                </div>
              </div>

              <!-- Confirmed Participants -->
              <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-2.5 text-xs">
                <div class="flex items-center justify-between">
                  <h4 class="font-bold text-slate-900">Participants (${act.currentParticipants}/${act.maxParticipants})</h4>
                  <span class="text-indigo-600 font-bold">${act.maxParticipants - act.currentParticipants} slots left</span>
                </div>
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${act.participants.map(p => `
                    <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-xl">
                      <img src="${p.avatar}" class="w-4 h-4 rounded-full" alt="p" />
                      <span class="text-xs font-medium text-slate-700">${p.name}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Primary Action Bar -->
              <div class="pt-1 pb-4 flex items-center gap-2">
                ${isJoined ? `
                  <button onclick="app.openChatForActivity('${act.id}')" class="flex-1 py-3 bg-indigo-600 text-white font-bold text-xs rounded-2xl shadow">
                    💬 Open Group Chat
                  </button>
                  <button onclick="app.openReplacementHub('${act.id}')" class="flex-1 py-3 bg-rose-600 text-white font-bold text-xs rounded-2xl shadow">
                    ⚡ Replacement Hub
                  </button>
                ` : `
                  <button onclick="app.initiateJoin('${act.id}')" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs rounded-2xl shadow-lg">
                    Join Activity (${act.estimatedContribution === 0 ? 'Free' : 'RM' + act.estimatedContribution})
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }

      // SCREEN E: Last-Minute Replacement Matching Modal
      openReplacementHub(activityId) {
        const act = this.activities.find(a => a.id === activityId) || this.activities[0];
        if (!act.replacementDetails) {
          act.needsReplacement = true;
          act.replacementDetails = {
            id: 'rep_' + Date.now(),
            slotIndex: act.maxParticipants,
            originalPlayerName: 'Last-Minute Dropout',
            reason: 'Unexpected academic tutorial clash',
            urgentNotice: 'Starts soon! 1 vacant slot open.',
            status: 'looking',
            createdAt: 'Just now',
            deadlineMinutes: 35,
            applicants: []
          };
        }
        const rep = act.replacementDetails;

        const html = `
          <div class="space-y-4 text-left">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <span class="text-xs font-bold text-rose-600 uppercase">⚡ Last-Minute Replacement Matching</span>
                <h3 class="text-base font-extrabold text-slate-900">${act.title}</h3>
              </div>
              <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
            </div>

            <!-- Status Progression Bar -->
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2 text-xs">
              <span class="font-bold text-slate-500 block">Live Status Progression:</span>
              <div class="grid grid-cols-4 gap-1 text-center font-bold text-xs">
                <div class="p-1.5 rounded-lg ${rep.status === 'looking' ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-700'}">1. Looking</div>
                <div class="p-1.5 rounded-lg ${rep.status === 'applicants_available' ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-700'}">2. Applicants (${rep.applicants.length})</div>
                <div class="p-1.5 rounded-lg ${rep.status === 'confirmed' ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">3. Confirmed</div>
                <div class="p-1.5 rounded-lg ${rep.status === 'completed' ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'}">4. Completed</div>
              </div>
            </div>

            <div class="bg-rose-50 border border-rose-200 rounded-2xl p-3 text-xs text-rose-900 space-y-1">
              <div><strong>Venue:</strong> ${act.venue} (${act.time})</div>
              <div><strong>Reason:</strong> ${rep.reason}</div>
              <div><strong>Contribution:</strong> RM${act.estimatedContribution} • Host Reliability: ★${act.organiser.reliabilityScore}</div>
            </div>

            <!-- Applicants List -->
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-extrabold text-slate-800">Interested Replacement Participants</h4>
                <button onclick="app.simulateNewApplicant('${act.id}')" class="text-xs font-bold text-indigo-600 hover:underline">
                  + Simulate New Applicant
                </button>
              </div>

              ${rep.applicants.length > 0 ? rep.applicants.map(appUser => `
                <div class="bg-white border border-slate-200 rounded-2xl p-3 flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <img src="${appUser.avatar}" class="w-9 h-9 rounded-full" alt="u" />
                    <div>
                      <h5 class="text-xs font-bold text-slate-900">${appUser.name}</h5>
                      <p class="text-xs text-emerald-700 font-semibold">★ ${appUser.reliabilityScore}/100 Reliability</p>
                    </div>
                  </div>
                  ${rep.status === 'confirmed' ? `
                    <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-xl">✓ Confirmed</span>
                  ` : `
                    <button onclick="app.confirmReplacementApplicant('${act.id}', '${appUser.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl">
                      Confirm Replacement
                    </button>
                  `}
                </div>
              `).join('') : `
                <div class="p-4 bg-slate-50 rounded-2xl text-center text-xs text-slate-500">
                  Waiting for nearby UMS students... Click <strong>"+ Simulate New Applicant"</strong> above to test!
                </div>
              `}
            </div>
          </div>
        `;
        openModal(html);
      }

      publishNewReplacementRequest(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act) return;
        act.needsReplacement = true;
        if (act.currentParticipants >= act.maxParticipants) {
          act.currentParticipants = act.maxParticipants - 1;
        }
        act.replacementDetails = {
          id: 'rep_' + Date.now(),
          slotIndex: act.maxParticipants,
          originalPlayerName: 'Withdrawn Participant',
          reason: 'Last-minute cancellation — urgent replacement needed',
          urgentNotice: '1 vacant slot open now!',
          status: 'looking',
          createdAt: 'Just now',
          deadlineMinutes: 40,
          applicants: []
        };
        this.render();
        this.openReplacementHub(activityId);
        this.toast('⚡ Replacement request published to nearby UMS students!', 'info');
      }

      simulateNewApplicant(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act || !act.replacementDetails) return;
        const newCand = {
          id: 'usr_sim_' + Date.now(),
          name: 'Aiman Hakim (FKI)',
          avatar: createAvatarSvg('#2563eb', 'AH'),
          faculty: 'Faculty of Computing & Informatics',
          reliabilityScore: 95
        };
        act.replacementDetails.applicants.push(newCand);
        act.replacementDetails.status = 'applicants_available';
        this.openReplacementHub(activityId);
        this.toast('New student expressed interest in filling the slot!', 'info');
      }

      confirmReplacementApplicant(activityId, applicantId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act || !act.replacementDetails) return;
        const applicant = act.replacementDetails.applicants.find(a => a.id === applicantId);
        if (!applicant) return;

        act.replacementDetails.status = 'confirmed';
        act.needsReplacement = false;
        act.currentParticipants = act.maxParticipants;
        act.participants.push(applicant);

        this.notifications.unshift({
          id: 'notif_' + Date.now(),
          title: 'Your replacement has been confirmed!',
          message: `${applicant.name} is confirmed for ${act.title}. Squad is now full (${act.currentParticipants}/${act.maxParticipants}).`,
          timestamp: 'Just now',
          isRead: false,
          type: 'replacement',
          targetActivityId: act.id
        });

        closeModal();
        this.render();
        this.toast(`✅ Replacement confirmed! ${applicant.name} joined ${act.title}.`, 'success');
      }

      // SCREEN F: Create Activity
      renderCreate() {
        const d = this.createDraft;
        return `
          <div class="p-4 space-y-4">
            <div>
              <h2 class="text-lg font-extrabold text-slate-900">Create New Campus Activity</h2>

              <div>
                <label class="font-bold text-slate-800 block mb-1">Activity Name *</label>
                <input type="text" value="${d.title}" oninput="app.updateCreateDraft('title', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold" />

              <div class="grid grid-cols-2 gap-2">

                    <option value="running" ${d.category === 'running' ? 'selected' : ''}>🏃 Running / Gym</option>
                    <option value="study" ${d.category === 'study' ? 'selected' : ''}>📚 Study Together</option>
                    <option value="hangout" ${d.category === 'hangout' ? 'selected' : ''}>☕ Casual Hangout</option>

                </div>
                <div>
                  <label class="font-bold text-slate-800 block mb-1">Skill Level</label>
                  <select onchange="app.updateCreateDraft('skillLevel', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs font-semibold">
                    <option value="all">Open to All</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="competitive">Competitive</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="font-bold text-slate-800 block mb-1">Date</label>
                  <input type="text" value="${d.date}" oninput="app.updateCreateDraft('date', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />

                <div>
                  <label class="font-bold text-slate-800 block mb-1">Start Time</label>
                  <input type="text" value="${d.time}" oninput="app.updateCreateDraft('time', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />

              </div>

              <div>
                <label class="font-bold text-slate-800 block mb-1">UMS Campus Venue *</label>
                <input type="text" value="${d.venue}" oninput="app.updateCreateDraft('venue', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
              </div>

              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="font-bold text-slate-800 block mb-1">Current Pax</label>
                  <input type="number" value="${d.currentParticipants}" oninput="app.updateCreateDraft('currentParticipants', parseInt(this.value)||1)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
                <div>
                  <label class="font-bold text-slate-800 block mb-1">Required Pax</label>
                  <input type="number" value="${d.maxParticipants}" oninput="app.updateCreateDraft('maxParticipants', parseInt(this.value)||2)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
                <div>
                  <label class="font-bold text-slate-800 block mb-1">Est. Fee (RM)</label>
                  <input type="number" value="${d.estimatedContribution}" oninput="app.updateCreateDraft('estimatedContribution', parseInt(this.value)||0)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />

              </div>

              <div>
                <label class="font-bold text-slate-800 block mb-1">Description</label>
                <textarea rows="2" oninput="app.updateCreateDraft('description', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5">${d.description}</textarea>
              </div>
            </div>

            <!-- Live Card Preview -->
            <div>
              <span class="text-xs font-extrabold text-slate-400 uppercase tracking-wider block mb-2">Live Activity Card Preview</span>
              <div id="live-preview-box">
                ${this.renderPreviewCard()}
              </div>

            <button onclick="app.submitNewActivity()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs shadow-lg">

            </button>
          </div>

      updateCreateDraft(field, val) {
        this.createDraft[field] = val;
        const box = document.getElementById('live-preview-box');
        if (box) box.innerHTML = this.renderPreviewCard();
      }

      renderPreviewCard() {
        const d = this.createDraft;
        const previewAct = {
          id: 'preview',
          title: d.title || 'New Campus Activity',
          category: d.category,
          categoryLabel: d.category.toUpperCase(),
          imageUrl: CATEGORY_BANNERS[d.category] || CATEGORY_BANNERS.futsal,
          date: d.date,
          time: d.time,
          venue: d.venue,
          skillLevelLabel: 'All Welcome',
          currentParticipants: d.currentParticipants,
          maxParticipants: d.maxParticipants,
          estimatedContribution: d.estimatedContribution,
          needsReplacement: (d.maxParticipants - d.currentParticipants) === 1,
          organiser: {
            name: this.user.name,
            avatar: this.user.avatar,
            reliabilityScore: this.user.reliabilityScore
          }
        };
        return this.renderActivityCard(previewAct, previewAct.needsReplacement);
      }

      submitNewActivity() {
        const d = this.createDraft;
        if (!d.title.trim()) {
          this.toast('Please enter an activity name', 'error');
          return;
        }
        const newAct = {
          id: 'act_' + Date.now(),
          title: d.title,
          category: d.category,
          categoryLabel: d.category.toUpperCase(),
          imageUrl: CATEGORY_BANNERS[d.category] || CATEGORY_BANNERS.futsal,
          date: d.date,
          time: d.time,
          endTime: d.endTime,
          venue: d.venue,
          venueDetails: 'Organised by ' + this.user.name,
          campusArea: 'UMS Campus',
          currentParticipants: d.currentParticipants,
          maxParticipants: d.maxParticipants,
          needsReplacement: (d.maxParticipants - d.currentParticipants) === 1,
          estimatedContribution: d.estimatedContribution,
          contributionNote: d.estimatedContribution === 0 ? 'Free session' : `RM${d.estimatedContribution} estimated contribution per participant`,
          commitmentDeposit: 0,
          skillLevel: d.skillLevel,
          skillLevelLabel: 'Open to All',
          description: d.description,
          cancellationPolicy: 'Please notify at least 2 hours before start time.',
          isJoined: true,
          organiser: {
            id: this.user.id,
            name: this.user.name,
            avatar: this.user.avatar,
            faculty: this.user.faculty,
            reliabilityScore: this.user.reliabilityScore,
            isOrganiser: true
          },
          participants: [
            { id: this.user.id, name: this.user.name + ' (Host)', avatar: this.user.avatar, reliabilityScore: this.user.reliabilityScore }
          ]
        };
        this.activities.unshift(newAct);
        this.user.joinedActivityIds.push(newAct.id);
        this.selectedActivityId = newAct.id;
        navigateTo('details');
        this.toast('🎉 Activity created and added to UMS Home & Explore feeds!', 'success');
      }

      // SCREEN G: Mood-Based Recommendations ("Find Your Vibe")
      renderVibe() {
        const s = this.vibeState;
        const matched = this.getVibeRecommendations();

        return `
          <div class="p-4 space-y-4">
            <div class="flex items-center justify-between">
              <button onclick="navigateTo('home')" class="text-xs font-bold text-slate-500">← Skip / Back Home</button>
              <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">🔒 Private by Default</span>
            </div>

            <div class="bg-gradient-to-r from-indigo-800 to-emerald-700 rounded-3xl p-4 text-white space-y-1">
              <span class="text-xs font-bold text-emerald-300 uppercase">✨ Find Your Vibe</span>
              <h2 class="text-lg font-extrabold">Mood-Based Activity Discovery</h2>
              <p class="text-xs text-indigo-100">Select your current mood and preferred interaction style below.</p>
            </div>

            <!-- Step 1: Mood -->
            <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-2.5 text-xs">
              <h4 class="font-extrabold text-slate-900">Step 1: How are you feeling today?</h4>
              <div class="grid grid-cols-5 gap-1.5">
                ${[
                  { id: 'energetic', icon: '⚡', label: 'Energetic' },
                  { id: 'happy', icon: '😄', label: 'Happy' },
                  { id: 'calm', icon: '🌿', label: 'Calm' },
                  { id: 'tired', icon: '😴', label: 'Tired' },
                  { id: 'stressed', icon: '🧠', label: 'Stressed' }
                ].map(m => `
                  <button onclick="app.setVibeMood('${m.id}')" class="p-2 rounded-2xl border flex flex-col items-center gap-1 transition ${s.mood === m.id ? 'bg-indigo-600 text-white border-indigo-600 font-bold' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                    <span class="text-base">${m.icon}</span>
                    <span class="text-xs">${m.label}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Step 2: Social Interaction -->
            <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-2.5 text-xs">
              <h4 class="font-extrabold text-slate-900">Step 2: What kind of interaction would you prefer?</h4>
              <div class="grid grid-cols-2 gap-2">
                ${[
                  { id: 'active_group', label: '🏆 Active group' },
                  { id: 'small_casual', label: '👥 Small, casual group' },
                  { id: 'quiet_low_pressure', label: '🎧 Quiet & low-pressure' },
                  { id: 'study_others', label: '📚 Study with others' },
                  { id: 'no_preference', label: '🎲 No preference' }
                ].map(i => `
                  <button onclick="app.setVibeInteraction('${i.id}')" class="p-2.5 rounded-xl border text-left font-semibold transition ${s.interaction === i.id ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                    ${i.label}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Step 3: Explanation & Recommendations -->
            <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3.5 text-xs text-indigo-950 space-y-1">
              <div class="font-extrabold text-indigo-800">Why these suit your vibe (${s.mood.toUpperCase()}):</div>
              <p class="leading-relaxed">${this.getVibeExplanation(s.mood)}</p>
              <p class="text-xs text-slate-500 pt-1 italic">
                Note: Mood responses are private lifestyle suggestions, never displayed publicly or included in your reliability score.
              </p>
            </div>

            <div class="space-y-3">
              ${matched.map(act => this.renderActivityCard(act, act.needsReplacement)).join('')}
            </div>
          </div>
        `;
      }

      setVibeMood(m) {
        this.vibeState.mood = m;
        this.render();
      }

      setVibeInteraction(i) {
        this.vibeState.interaction = i;
        this.render();
      }

      getVibeExplanation(mood) {
        const map = {
          energetic: 'Since you feel Energetic, high-tempo games like Futsal, Badminton, Basketball, or Running are great ways to channel your momentum!',
          happy: 'You’re in a Happy mood! Group sports and social hangouts around UMS are great for sharing good vibes with peers.',
          calm: 'For a Calm state of mind, study groups at UMS Library or a scenic sunset walk/jog at ODEC Beach offer steady, focused company.',
          tired: 'Feeling Tired after lectures? Relaxed hangouts or low-intensity study pods let you socialise without physical exhaustion.',
          stressed: 'Feeling Stressed? Optional light exercise like a sunset coastal run or a low-pressure board game hangout can help you unwind.'
        };
        return map[mood] || map.energetic;
      }

      getVibeRecommendations() {
        const m = this.vibeState.mood;
        if (m === 'energetic') return this.activities.filter(a => ['futsal', 'badminton', 'basketball', 'running'].includes(a.category));
        if (m === 'happy') return this.activities.filter(a => ['hangout', 'badminton', 'futsal'].includes(a.category));
        if (m === 'calm') return this.activities.filter(a => ['study', 'running', 'hangout'].includes(a.category));
        if (m === 'tired') return this.activities.filter(a => ['hangout', 'study'].includes(a.category));
        if (m === 'stressed') return this.activities.filter(a => ['running', 'hangout', 'badminton'].includes(a.category));
        return this.activities;
      }

      // SCREEN H: Inbox & Notifications
      renderInbox() {
        return `
          <div class="p-4 space-y-4">
            <h2 class="text-lg font-extrabold text-slate-900">Inbox &amp; Notification Centre</h2>

            <div class="bg-slate-200 p-1 rounded-2xl flex text-xs font-bold">
              <button onclick="app.setInboxTab('notifications')" class="flex-1 py-2 rounded-xl ${this.activeInboxTab === 'notifications' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">
                🔔 Notifications (${this.notifications.length})
              </button>
              <button onclick="app.setInboxTab('messages')" class="flex-1 py-2 rounded-xl ${this.activeInboxTab === 'messages' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">
                💬 Activity Chats (${this.conversations.length})
              </button>
            </div>

            ${this.activeInboxTab === 'notifications' ? `
              <div class="space-y-2.5">
                ${this.notifications.map(n => `
                  <div onclick="app.handleNotificationClick('${n.id}')" class="bg-white border ${n.isRead ? 'border-slate-200' : 'border-indigo-300 bg-indigo-50/30'} rounded-2xl p-3.5 flex items-start gap-3 cursor-pointer hover:border-indigo-400 transition">
                    <div class="w-8 h-8 rounded-xl ${n.type === 'replacement' ? 'bg-rose-600' : 'bg-indigo-600'} text-white flex items-center justify-center text-xs font-bold shrink-0">
                      ${n.type === 'replacement' ? '⚡' : '🔔'}
                    </div>
                    <div class="flex-1 text-xs">
                      <div class="flex justify-between font-bold text-slate-900 mb-0.5">
                        <span>${n.title}</span>
                        <span class="text-slate-400 font-normal">${n.timestamp}</span>
                      </div>
                      <p class="text-slate-600">${n.message}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : this.renderInboxChatView()}
          </div>
        `;
      }

      renderInboxChatView() {
        const conv = this.conversations.find(c => c.id === this.activeConversationId) || this.conversations[0];
        return `
          <div class="space-y-3">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
              ${this.conversations.map(c => `
                <button onclick="app.selectConversation('${c.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${c.id === conv.id ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
                  ${c.title}
                </button>
              `).join('')}
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden flex flex-col h-[420px]">
              <div class="p-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between text-xs">
                <span class="font-bold text-slate-900">${conv.title}</span>
                <button onclick="app.openActivityDetails('${conv.activityId}')" class="text-indigo-600 font-bold">Open Activity →</button>
              </div>

              <div class="flex-1 p-3 overflow-y-auto space-y-2.5 text-xs">
                ${conv.messages.map(m => `
                  <div class="flex flex-col ${m.isMe ? 'items-end' : 'items-start'}">
                    <span class="text-xs text-slate-400 mb-0.5">${m.senderName} • ${m.timestamp}</span>
                    <div class="max-w-[80%] px-3 py-2 rounded-2xl ${m.isMe ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-800'}">
                      ${m.text}
                    </div>
                  </div>
                `).join('')}
              </div>

              <form onsubmit="app.sendMessage(event)" class="p-2.5 border-t border-slate-200 flex gap-2">
                <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 bg-slate-100 rounded-xl px-3 py-2 text-xs focus:outline-none" />
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl">Send</button>
              </form>
            </div>
          </div>
        `;
      }

              </div>
              <ul class="space-y-1 text-indigo-100">
                <li>⚡ Instant alerts for matching vacant replacement slots</li>
                <li>✨ Personalised mood-based recommendations</li>
                <li>🔍 Advanced matching filters &amp; saved preferences</li>
                <li>📊 Activity history &amp; participation statistics</li>
              </ul>
              ${this.user.subscriptionPlan === 'plus' ? `
                <button onclick="app.switchSubscriptionPlan('free')" class="w-full py-2.5 bg-white/15 text-white font-bold rounded-xl">
                  Active Plan • Click to Manage / Cancel Mock Plan
                </button>
              ` : `
                <button onclick="app.openUpgradeModal()" class="w-full py-2.5 bg-emerald-500 text-slate-950 font-extrabold rounded-xl shadow">
                  Upgrade to ActiMate Plus (Simulated Checkout)
                </button>
              `}
            </div>

            <!-- ActiMate Organiser -->
            <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-2 text-xs">
              <div class="flex justify-between items-center">
                <div>
                  <h3 class="font-extrabold text-slate-900 text-sm">ActiMate Organiser</h3>
                  <span class="text-slate-400">Future concept for UMS Student Clubs</span>
                </div>
                <span class="text-base font-black text-slate-800">RM9.90/mo</span>
              </div>
              <p class="text-slate-600">Multi-session management, waiting-list automation, recurring club bookings &amp; attendance reports.</p>
            </div>
          </div>
        `;
      }

      // SCREEN K: Settings & Safety
      renderSettings() {
        return `
          <div class="p-4 space-y-4 text-xs">
            <div class="flex items-center justify-between">
              <button onclick="navigateTo('profile')" class="font-bold text-slate-500">← Back to Profile</button>
              <span class="font-bold text-slate-400">Settings &amp; Safety</span>
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-3">
              <h4 class="font-extrabold text-slate-900 text-sm">Privacy &amp; Safety Controls</h4>
              <div class="flex justify-between items-center py-1 border-b border-slate-100">
                <span>Mood Check-in Privacy (Keep 100% Private)</span>
                <input type="checkbox" checked class="w-4 h-4" />
              </div>
              <div class="flex justify-between items-center py-1 border-b border-slate-100">
                <span>UMS Verified Student Only Visibility</span>
                <input type="checkbox" checked class="w-4 h-4" />
              </div>
              <div class="flex justify-between items-center py-1">
                <span>Instant Replacement Push Notifications</span>
                <input type="checkbox" checked class="w-4 h-4" />
              </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-2">
              <h4 class="font-extrabold text-slate-900 text-sm">Community &amp; Prototype Info</h4>
              <p class="text-slate-600">All payments, verification badges, and chats are simulated locally with mock state for lecturer demonstration.</p>
              <div class="pt-2 flex flex-col gap-2">
                <button onclick="app.showReliabilityModal()" class="py-2 px-3 bg-slate-100 rounded-xl font-bold text-slate-800 text-left">🛡️ View Reliability &amp; Cancellation Rules</button>
                <button onclick="app.resetData()" class="py-2 px-3 bg-slate-100 rounded-xl font-bold text-slate-800 text-left">↺ Reset Prototype Local Data</button>
                <button onclick="navigateTo('onboarding')" class="py-2 px-3 bg-rose-50 text-rose-700 rounded-xl font-bold text-left">🚪 Sign Out to Welcome Screen</button>
              </div>
            </div>
          </div>
        `;
      }

      // Modals & Interactive Handlers
      initiateJoin(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act) return;
        const html = `
          <div class="space-y-4 text-left text-xs">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
              <h3 class="text-sm font-extrabold text-slate-900">Confirm Activity Participation</h3>
              <button onclick="closeModal()" class="text-slate-400 font-bold">✕</button>
            </div>
            <div class="bg-slate-50 p-3 rounded-2xl space-y-1">
              <div class="font-extrabold text-slate-900 text-sm">${act.title}</div>
              <div class="text-slate-600">📍 ${act.venue} • ${act.date}, ${act.time}</div>
            </div>
            <div class="border border-slate-200 rounded-2xl p-3 space-y-1.5">
              <div class="flex justify-between">
                <span>Estimated Activity Contribution:</span>
                <span class="font-bold">RM${act.estimatedContribution}</span>
              </div>
              <div class="flex justify-between text-slate-500">
                <span>Commitment Deposit (Refunded on attendance):</span>
                <span class="font-bold">RM${act.commitmentDeposit}</span>
              </div>
            </div>
            <p class="text-slate-500 italic">Demo notice: No real payment is processed. Confirming updates local mock state immediately.</p>
            <div class="flex gap-2">
              <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 rounded-xl font-bold text-slate-700">Cancel</button>
              <button onclick="app.confirmJoin('${act.id}')" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-extrabold">Confirm &amp; Join</button>
            </div>
          </div>
        `;
        openModal(html);
      }

      confirmJoin(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act) return;
        if (!act.participants.some(p => p.id === this.user.id)) {
          act.participants.push({
            id: this.user.id,
            name: this.user.name + ' (You)',
            avatar: this.user.avatar,
            reliabilityScore: this.user.reliabilityScore
          });
          act.currentParticipants = Math.min(act.currentParticipants + 1, act.maxParticipants);
        }
        act.isJoined = true;
        act.needsReplacement = false;
        if (!this.user.joinedActivityIds.includes(act.id)) {
          this.user.joinedActivityIds.push(act.id);
        }
        closeModal();
        this.render();
        this.toast(`🎉 Confirmed for ${act.title}! Participant count updated.`, 'success');
      }

      toggleSaveActivity(activityId) {
        const idx = this.user.savedActivityIds.indexOf(activityId);
        if (idx >= 0) {
          this.user.savedActivityIds.splice(idx, 1);
          this.toast('Removed from Saved Activities', 'info');
        } else {
          this.user.savedActivityIds.push(activityId);
          this.toast('❤️ Activity saved!', 'success');
        }
        this.render();
      }

      showReliabilityModal() {
        openModal(`
          <div class="space-y-3 text-left text-xs">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
              <h3 class="text-sm font-extrabold text-slate-900">🛡️ How Reliability Score Works</h3>
              <button onclick="closeModal()" class="text-slate-400 font-bold">✕</button>
            </div>
            <p class="text-slate-600">ActiMate’s Reliability Score promotes fair attendance so UMS court bookings and group sessions aren't ruined by no-shows:</p>
            <div class="space-y-1.5">
              <div class="p-2.5 bg-emerald-50 text-emerald-900 rounded-xl font-semibold">+3 pts • Attending confirmed activities on time</div>
              <div class="p-2.5 bg-indigo-50 text-indigo-900 rounded-xl font-semibold">+2 pts • Stepping in as a last-minute replacement</div>
              <div class="p-2.5 bg-amber-50 text-amber-900 rounded-xl font-semibold">-2 pts • Late cancellation (&lt;2 hours) without replacement</div>
              <div class="p-2.5 bg-rose-50 text-rose-900 rounded-xl font-semibold">-5 pts • Unnotified no-show</div>
            </div>
            <p class="text-slate-500">Fairness guarantee: Never affected by mood check-ins, social popularity, or subscription status.</p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-slate-900 text-white font-bold rounded-xl">Got It</button>
          </div>
        `);
      }

      openUpgradeModal() {
        openModal(`
          <div class="space-y-3 text-left text-xs">
            <h3 class="text-sm font-extrabold text-slate-900">💎 Upgrade to ActiMate Plus (Mock Demo)</h3>
            <p class="text-slate-600">Simulated student plan activation (RM4.90/month). No real payment credentials collected.</p>
            <div class="flex gap-2 pt-2">
              <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 rounded-xl font-bold">Cancel</button>
              <button onclick="app.switchSubscriptionPlan('plus'); closeModal();" class="flex-1 py-2.5 bg-emerald-600 text-white rounded-xl font-extrabold">Activate Plus</button>
            </div>
          </div>
        `);
      }

      switchSubscriptionPlan(plan) {
        this.user.subscriptionPlan = plan;
        this.render();
        this.toast(plan === 'plus' ? '💎 ActiMate Plus activated (Mock State)!' : 'Switched to Free Student Plan', 'success');
      }

      setBillingCycle(cycle) {
        this.billingCycle = cycle;
        this.render();
      }

      openEditProfileModal() {
        openModal(`
          <div class="space-y-3 text-left text-xs">
            <h3 class="text-sm font-extrabold text-slate-900">Edit UMS Student Profile</h3>
            <div>
              <label class="font-bold block mb-1">Display Name</label>
              <input id="edit-name-input" type="text" value="${this.user.name}" class="w-full border border-slate-200 rounded-xl px-3 py-2" />
            </div>
            <div>
              <label class="font-bold block mb-1">Bio</label>
              <textarea id="edit-bio-input" rows="2" class="w-full border border-slate-200 rounded-xl p-2">${this.user.bio}</textarea>
            </div>
            <div class="flex gap-2">
              <button onclick="closeModal()" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">Cancel</button>
              <button onclick="app.saveProfileEdits()" class="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">Save</button>
            </div>
          </div>
        `);
      }

      saveProfileEdits() {
        const n = document.getElementById('edit-name-input')?.value;
        const b = document.getElementById('edit-bio-input')?.value;
        if (n) this.user.name = n;
        if (b) this.user.bio = b;
        closeModal();
        this.render();
        this.toast('Profile updated!', 'success');
      }

      showReportModal() {
        openModal(`
          <div class="space-y-3 text-left text-xs">
            <h3 class="text-sm font-extrabold text-slate-900">Report Activity</h3>
            <p class="text-slate-600">Select a reason for reporting this activity to UMS moderators:</p>
            <button onclick="closeModal(); app.toast('Report submitted to UMS safety team', 'info');" class="w-full py-2.5 bg-rose-600 text-white font-bold rounded-xl">Submit Mock Report</button>
          </div>
        `);
      }

      showAuthModal() {
        openModal(`
          <div class="space-y-3 text-left text-xs">
            <h3 class="text-sm font-extrabold text-slate-900">UMS Student Verification</h3>
            <input type="email" value="farhan.azman@student.ums.edu.my" class="w-full border border-slate-200 rounded-xl px-3 py-2" />
            <button onclick="closeModal(); app.completeOnboarding();" class="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl">Verify &amp; Sign In</button>
          </div>
        `);
      }

      completeOnboarding() {
        this.currentScreen = 'home';
        this.render();
        this.toast('Welcome to ActiMate UMS Demo!', 'success');
      }

      openActivityDetails(id) {
        this.selectedActivityId = id;
        this.currentScreen = 'details';
        this.render();
      }

      openChatForActivity(activityId) {
        const conv = this.conversations.find(c => c.activityId === activityId);
        if (conv) this.activeConversationId = conv.id;
        this.activeInboxTab = 'messages';
        this.currentScreen = 'inbox';
        this.render();
      }

      setInboxTab(tab) {
        this.activeInboxTab = tab;
        this.render();
      }

      selectConversation(id) {
        this.activeConversationId = id;
        this.render();
      }

      sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        if (!input || !input.value.trim()) return;
        const conv = this.conversations.find(c => c.id === this.activeConversationId) || this.conversations[0];
        conv.messages.push({
          id: 'm_' + Date.now(),
          senderName: this.user.name,
          text: input.value.trim(),
          timestamp: 'Just now',
          isMe: true
        });
        input.value = '';
        this.render();
      }

      handleNotificationClick(id) {
        const n = this.notifications.find(x => x.id === id);
        if (!n) return;
        n.isRead = true;
        if (n.targetActivityId) {
          this.openActivityDetails(n.targetActivityId);
        } else {
          this.render();
        }
      }

      quickMoodSelect(mood) {
        this.vibeState.mood = mood;
        this.currentScreen = 'vibe';
        this.render();
      }

      filterByCategory(cat) {
        this.exploreFilters.category = cat;
        this.exploreFilters.onlyReplacements = false;
        this.currentScreen = 'explore';
        this.render();
      }

      filterReplacementsOnly() {
        this.exploreFilters.onlyReplacements = true;
        this.exploreFilters.category = 'all';
        this.currentScreen = 'explore';
        this.render();
      }

      handleSearchInput(val) {
        this.exploreFilters.searchQuery = val;
        this.render();
      }

      setExploreCategory(cat) {
        this.exploreFilters.category = cat;
        this.render();
      }

      toggleReplacementFilter() {
        this.exploreFilters.onlyReplacements = !this.exploreFilters.onlyReplacements;
        this.render();
      }

      setSortBy(val) {
        this.exploreFilters.sortBy = val;
        this.render();
      }

      setBudgetFilter(val) {
        this.exploreFilters.budget = val;
        this.render();
      }

      resetFilters() {
        this.exploreFilters = {
          searchQuery: '',
          category: 'all',
          skillLevel: 'all',
          budget: 'all',
          onlyReplacements: false,
          sortBy: 'recommended'
        };
        this.render();
      }
    }

    const app = new ActiMateApp();

    function navigateTo(screen) {
      app.currentScreen = screen;
      app.render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(html) {
      const c = document.getElementById('modal-container');
      const m = document.getElementById('modal-content');
      if (!c || !m) return;
      m.innerHTML = html;
      c.classList.remove('hidden');
      c.classList.add('flex');
    }

    function closeModal() {
      const c = document.getElementById('modal-container');
      if (!c) return;
      c.classList.add('hidden');
      c.classList.remove('flex');
    }

    function toggleDeviceView() {
      const wrapper = document.getElementById('app-wrapper');
      const nav = document.getElementById('bottom-nav');
      const label = document.getElementById('view-mode-label');
      if (!wrapper || !label) return;
      if (wrapper.classList.contains('max-w-[430px]')) {
        wrapper.classList.remove('max-w-[430px]');
        wrapper.classList.add('max-w-4xl');
        if (nav) {
          nav.classList.remove('max-w-[430px]');
          nav.classList.add('max-w-4xl');
        }
        label.innerText = '💻 Desktop View';
      } else {
        wrapper.classList.add('max-w-[430px]');
        wrapper.classList.remove('max-w-4xl');
        if (nav) {
          nav.classList.add('max-w-[430px]');
          nav.classList.remove('max-w-4xl');
        }
        label.innerText = '📱 Mobile View';
      }
    }

    function resetMockData() {
      app.resetData();
    }

    function openVibeFlow() {
      navigateTo('vibe');
    }

    // Render immediately!
    app.render();
  </script>
</body>
</html>
