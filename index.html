<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0f172a">
  <title>ActiMate — UMS Campus Activity & Replacement Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* animate-ui inspired smooth container transitions (no hover motion scaling) */
    @keyframes animateUiFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-ui-screen {
      animation: animateUiFadeIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes animateUiModal {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-ui-modal {
      animation: animateUiModal 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-900 antialiased min-h-screen flex flex-col items-center justify-start p-0 sm:py-4 sm:px-4">

  <!-- Desktop Presentation Bar (Flat, No Gradients, No Shadows, No Colored Borders, No Emojis) -->
  <header class="w-full max-w-5xl mb-3 hidden sm:flex items-center justify-between bg-slate-900 border border-slate-800 rounded-2xl px-5 py-3 text-white">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white text-base">
        A
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold tracking-tight text-white text-base">ActiMate</span>
          <span class="text-xs font-semibold bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full">UMS Edition</span>
          <span class="text-xs font-semibold bg-emerald-950 text-emerald-300 px-2.5 py-0.5 rounded-full flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Live Prototype
          </span>
        </div>
        <p class="text-xs text-slate-400">Social Activity-Matching &amp; Last-Minute Replacement Platform • Universiti Malaysia Sabah</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="navigateTo('onboarding')" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors">
        Welcome Screen
      </button>
      <button onclick="toggleDeviceView()" id="btn-device-view" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors flex items-center gap-1.5">
        <span id="view-mode-label">Mobile View</span>
      </button>
      <button onclick="resetMockData()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors">
        Reset Demo
      </button>
      <button onclick="openVibeFlow()" class="text-xs font-semibold px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white transition-colors">
        Find Your Vibe
      </button>
    </div>
  </header>

  <!-- Mobile Frame Container -->
  <main id="app-wrapper" class="w-full max-w-[430px] bg-slate-50 min-h-screen sm:rounded-t-[36px] sm:border-x-[6px] sm:border-t-[6px] sm:border-slate-800 relative flex flex-col pb-24">
    
    <!-- Mobile Status Bar (Sticky at top while scrolling) -->
    <div class="bg-white px-5 pt-3 pb-2.5 flex items-center justify-between text-xs text-slate-600 font-semibold shrink-0 border-b border-slate-200 sticky top-0 z-40">

        <span class="font-bold text-slate-900">7:30 PM</span>

      </div>
      <div class="flex items-center gap-2 text-slate-700">
        <button onclick="navigateTo('onboarding')" class="text-xs text-indigo-600 font-semibold hover:underline">Intro</button>
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span class="text-xs font-bold text-slate-800">5G</span>
      </div>
    </div>

    <!-- Active Screen Viewport -->
    <div id="screen-container" class="flex-1 bg-slate-50">
      <!-- Dynamic Content Rendered Immediately Here -->
    </div>

  </main>

        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
      <span class="text-xs font-bold text-slate-800 mt-0.5">Create</span>
    </button>

    <button onclick="navigateTo('inbox')" id="nav-btn-inbox" class="nav-item flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-colors text-slate-500 hover:text-slate-900 relative">

    // Flat Architectural Vector Banner Generator
    function createFlatBannerSvg(bgHex, accentHex, label, sublabel, geometricType) {
      let geo = `<circle cx="490" cy="140" r="85" fill="${accentHex}"/><circle cx="490" cy="140" r="45" fill="${bgHex}"/>`;
      if (geometricType === 'court') {
        geo = `<rect x="410" y="40" width="150" height="200" rx="16" fill="${accentHex}"/><line x1="410" y1="140" x2="560" y2="140" stroke="${bgHex}" stroke-width="6"/><circle cx="485" cy="140" r="28" fill="none" stroke="${bgHex}" stroke-width="6"/>`;
      } else if (geometricType === 'grid') {
        geo = `<rect x="420" y="50" width="65" height="65" rx="12" fill="${accentHex}"/><rect x="495" y="50" width="65" height="65" rx="12" fill="${accentHex}" opacity="0.6"/><rect x="420" y="125" width="65" height="65" rx="12" fill="${accentHex}" opacity="0.4"/><rect x="495" y="125" width="65" height="65" rx="12" fill="${accentHex}"/>`;
      } else if (geometricType === 'track') {
        geo = `<path d="M390 220 C430 80, 520 80, 560 220" fill="none" stroke="${accentHex}" stroke-width="28" stroke-linecap="round"/><circle cx="475" cy="150" r="24" fill="${accentHex}"/>`;
      }
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260">
        <rect width="600" height="260" fill="${bgHex}"/>
        ${geo}
        <rect x="32" y="42" width="44" height="6" rx="3" fill="${accentHex}"/>
        <text x="32" y="88" font-family="sans-serif" font-size="22" font-weight="800" fill="#ffffff">${label}</text>
        <text x="32" y="114" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">${sublabel}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function createAvatarSvg(bg, initials) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
        <rect width="120" height="120" rx="60" fill="${bg}"/>
        <text x="60" y="72" font-family="sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">${initials}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

      resetData() {
        this.activities = JSON.parse(JSON.stringify(DEFAULT_ACTIVITIES));
        this.user = JSON.parse(JSON.stringify(DEFAULT_USER));
        this.notifications = JSON.parse(JSON.stringify(DEFAULT_NOTIFICATIONS));
        this.conversations = JSON.parse(JSON.stringify(DEFAULT_CONVERSATIONS));
        this.currentScreen = 'home';
        this.render();
        this.toast('Demo data reset to initial UMS sample state', 'info');
      }

      toast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const el = document.createElement('div');
        const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'info' ? 'bg-indigo-600 text-white' : 'bg-rose-600 text-white';
        el.className = `animate-ui-modal ${bg} px-4 py-3 rounded-2xl flex items-center gap-2.5 text-xs font-bold pointer-events-auto`;
        el.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-white shrink-0"></span>
          <span class="flex-1">${message}</span>
          <button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100 text-white ml-2">Close</button>
        `;
        container.appendChild(el);
        setTimeout(() => {
          if (el && el.parentElement) el.remove();
        }, 3200);
      }

      render() {
        const container = document.getElementById('screen-container');
        if (!container) return;

        this.updateNavHighlight();

        let html = '';
        switch (this.currentScreen) {
          case 'onboarding':
            html = this.renderOnboarding();
            break;
          case 'home':
            html = this.renderHome();
            break;
          case 'explore':
            html = this.renderExplore();
            break;
          case 'create':
            html = this.renderCreate();
            break;
          case 'inbox':
            html = this.renderInbox();
            break;
          case 'profile':
            html = this.renderProfile();
            break;
          case 'details':
            html = this.renderDetails();
            break;
          case 'vibe':
            html = this.renderVibe();
            break;
          case 'subscription':
            html = this.renderSubscription();
            break;
          case 'settings':
            html = this.renderSettings();
            break;
          default:
            html = this.renderHome();
        }
        container.innerHTML = `<div class="animate-ui-screen">${html}</div>`;
        container.scrollTop = 0;
      }

      updateNavHighlight() {
        const navButtons = document.querySelectorAll('.nav-item');
        navButtons.forEach(btn => {
          btn.classList.remove('text-indigo-600', 'font-bold');
          btn.classList.add('text-slate-500');
        });

        const map = {
          home: 'nav-btn-home',
          explore: 'nav-btn-explore',
          inbox: 'nav-btn-inbox',
          profile: 'nav-btn-profile'
        };
        const activeId = map[this.currentScreen];
        if (activeId) {
          const el = document.getElementById(activeId);
          if (el) {
            el.classList.add('text-indigo-600', 'font-bold');
            el.classList.remove('text-slate-500');
          }
        }

        const bottomNav = document.getElementById('bottom-nav');
        if (bottomNav) {
          bottomNav.style.display = this.currentScreen === 'onboarding' ? 'none' : 'flex';
        }
      }

                  <span class="font-bold text-slate-900">Universiti Malaysia Sabah (UMS)</span>
                </div>

              </div>

              <div onclick="navigateTo('explore')" class="cursor-pointer bg-white border border-slate-200 rounded-2xl px-4 py-3 flex items-center gap-3 text-slate-400 transition-colors">

                  <button onclick="app.quickMoodSelect('${m.id}')" class="bg-indigo-700 hover:bg-indigo-800 rounded-xl py-2.5 px-1 flex flex-col items-center justify-center transition-colors">
                    <span class="text-xs font-bold text-white">${m.label}</span>

            </div>

            <!-- Activity Categories Chips -->
            <div>
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-xs font-extrabold text-slate-500 uppercase tracking-wider">Categories</h3>
                <button onclick="navigateTo('explore')" class="text-xs font-bold text-indigo-600">Explore All</button>
              </div>
              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">

                <button onclick="app.filterByCategory('futsal')" class="shrink-0 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-semibold text-xs flex items-center gap-1.5">${HUGE_ICONS.futsal} <span>Futsal &amp; Football</span></button>
                <button onclick="app.filterByCategory('badminton')" class="shrink-0 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-semibold text-xs flex items-center gap-1.5">${HUGE_ICONS.badminton} <span>Badminton</span></button>
                <button onclick="app.filterByCategory('basketball')" class="shrink-0 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-semibold text-xs flex items-center gap-1.5">${HUGE_ICONS.basketball} <span>Basketball</span></button>
                <button onclick="app.filterByCategory('running')" class="shrink-0 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-semibold text-xs flex items-center gap-1.5">${HUGE_ICONS.running} <span>Run &amp; Gym</span></button>
                <button onclick="app.filterByCategory('study')" class="shrink-0 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-semibold text-xs flex items-center gap-1.5">${HUGE_ICONS.study} <span>Study</span></button>
                <button onclick="app.filterByCategory('hangout')" class="shrink-0 px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-semibold text-xs flex items-center gap-1.5">${HUGE_ICONS.hangout} <span>Hangouts</span></button>
              </div>
            </div>

            <!-- SECTION: Needs 1 More Player -->
            <div>
              <div class="flex items-center justify-between mb-2.5">
                <div class="flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-rose-600"></span>
                  <h3 class="text-sm font-extrabold text-slate-900">Needs 1 More Player</h3>

              </div>
              <div class="space-y-3">
                ${urgentReplacements.map(act => this.renderActivityCard(act, true)).join('')}

              <div class="flex items-center justify-between mb-2.5">

      // Reusable Activity Card
      renderActivityCard(act, isUrgent = false) {
        const remainingSlots = act.maxParticipants - act.currentParticipants;
        const isSaved = this.user.savedActivityIds.includes(act.id);
        const isJoined = act.isJoined || this.user.joinedActivityIds.includes(act.id);

        return `
          <div onclick="app.openActivityDetails('${act.id}')" class="bg-white border border-slate-200 rounded-3xl overflow-hidden cursor-pointer">
            <div class="h-32 w-full relative bg-slate-900">
              <img src="${act.imageUrl}" class="w-full h-full object-cover" alt="${act.title}" />
              <div class="absolute top-3 left-3 flex items-center gap-1.5 flex-wrap">
                <span class="bg-white text-slate-900 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1.5">
                  ${this.getCategoryIcon(act.category)}
                  <span>${act.categoryLabel}</span>
                </span>
                ${act.needsReplacement ? `
                  <span class="bg-rose-600 text-white text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                    ${HUGE_ICONS.bolt}
                    <span>Needs ${remainingSlots} more player</span>
                  </span>
                ` : ''}
              </div>

              <button onclick="event.stopPropagation(); app.toggleSaveActivity('${act.id}')" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white flex items-center justify-center text-slate-700">
                ${isSaved ? HUGE_ICONS.heartFilled : HUGE_ICONS.heartOutline}
              </button>

              <div class="absolute bottom-2.5 left-3 right-3 flex items-center justify-between text-white text-xs">
                <span class="font-bold bg-slate-900/80 px-2.5 py-0.5 rounded-md">${act.date}, ${act.time}</span>
                <span class="font-bold bg-slate-900/80 px-2.5 py-0.5 rounded-md">${act.currentParticipants}/${act.maxParticipants} participants</span>
              </div>
            </div>

            <div class="p-4 space-y-3">
              <div>
                <h4 class="font-extrabold text-slate-900 text-sm">${act.title}</h4>
                <p class="text-xs text-slate-500 mt-1 flex items-center gap-1.5">
                  ${HUGE_ICONS.pin}
                  <span>${act.venue} • ${act.skillLevelLabel}</span>
                </p>
              </div>

              <div class="flex items-center justify-between border-t border-slate-100 pt-2.5 text-xs">
                <div class="flex items-center gap-2">
                  <img src="${act.organiser.avatar}" class="w-6 h-6 rounded-full" alt="host" />
                  <span class="font-semibold text-slate-700">${act.organiser.name}</span>
                  <span class="text-xs font-bold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-md flex items-center gap-1">
                    ${HUGE_ICONS.star}
                    <span>${act.organiser.reliabilityScore}</span>
                  </span>
                </div>
                <div class="font-extrabold text-indigo-600">
                  ${act.estimatedContribution === 0 ? 'Free' : 'RM' + act.estimatedContribution + ' est.'}
                </div>
              </div>

              <div class="pt-0.5 flex items-center gap-2">
                ${isJoined ? `
                  <button onclick="event.stopPropagation(); app.openActivityDetails('${act.id}')" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-50 text-emerald-800 font-bold text-xs flex items-center justify-center gap-1.5">
                    ${HUGE_ICONS.check}
                    <span>Joined Session</span>
                  </button>
                  ${act.needsReplacement ? `
                    <button onclick="event.stopPropagation(); app.openReplacementHub('${act.id}')" class="py-2.5 px-3 rounded-xl bg-rose-600 text-white font-bold text-xs">
                      Manage Replacement (${act.replacementDetails?.applicants?.length || 0})
                    </button>
                  ` : ''}
                ` : `
                  <button onclick="event.stopPropagation(); app.initiateJoin('${act.id}')" class="w-full py-2.5 px-3 rounded-xl ${isUrgent ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white font-bold text-xs transition-colors">
                    ${isUrgent ? 'Join as Replacement (' + remainingSlots + ' slot left)' : 'Join Activity'}
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }

      // SCREEN C: Explore Activities
      renderExplore() {
        let filtered = this.activities.filter(a => {
          if (this.exploreFilters.searchQuery) {
            const q = this.exploreFilters.searchQuery.toLowerCase();
            if (!a.title.toLowerCase().includes(q) && !a.venue.toLowerCase().includes(q) && !a.categoryLabel.toLowerCase().includes(q)) {
              return false;
            }
          }
          if (this.exploreFilters.category !== 'all' && a.category !== this.exploreFilters.category) return false;
          if (this.exploreFilters.budget === 'free' && a.estimatedContribution > 0) return false;
          if (this.exploreFilters.budget === 'under10' && a.estimatedContribution > 10) return false;
          if (this.exploreFilters.onlyReplacements && !a.needsReplacement) return false;
          return true;
        });

        if (this.exploreFilters.sortBy === 'slots') {
          filtered.sort((a, b) => (b.maxParticipants - b.currentParticipants) - (a.maxParticipants - a.currentParticipants));
        }

        return `
          <div class="p-4 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-extrabold text-slate-900">Explore UMS Activities</h2>
              <span class="text-xs font-bold text-slate-500">${filtered.length} results</span>
            </div>

            <div class="relative">
              <input 
                type="text" 
                value="${this.exploreFilters.searchQuery}"
                oninput="app.handleSearchInput(this.value)"
                placeholder="Search futsal, badminton, library, ODEC..." 
                class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none"
              />
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              <button onclick="app.toggleReplacementFilter()" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 ${this.exploreFilters.onlyReplacements ? 'bg-rose-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
                ${HUGE_ICONS.bolt}
                <span>Vacant Replacement Slots</span>
              </button>
              <button onclick="app.setExploreCategory('all')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'all' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">All</button>
              <button onclick="app.setExploreCategory('futsal')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'futsal' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">Futsal</button>
              <button onclick="app.setExploreCategory('badminton')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'badminton' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">Badminton</button>
              <button onclick="app.setExploreCategory('basketball')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'basketball' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">Basketball</button>
              <button onclick="app.setExploreCategory('running')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'running' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">Run &amp; Gym</button>
              <button onclick="app.setExploreCategory('study')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'study' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">Study</button>
              <button onclick="app.setExploreCategory('hangout')" class="shrink-0 px-3 py-2 rounded-xl text-xs font-bold ${this.exploreFilters.category === 'hangout' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">Hangout</button>
            </div>

            <div class="flex items-center justify-between bg-white border border-slate-200 rounded-2xl p-2.5 text-xs">
              <div class="flex items-center gap-1.5">
                <span class="text-slate-400 font-semibold">Sort:</span>
                <select onchange="app.setSortBy(this.value)" class="font-bold text-slate-800 bg-transparent focus:outline-none">
                  <option value="recommended" ${this.exploreFilters.sortBy === 'recommended' ? 'selected' : ''}>Recommended</option>
                  <option value="soonest" ${this.exploreFilters.sortBy === 'soonest' ? 'selected' : ''}>Starting Soon</option>
                  <option value="slots" ${this.exploreFilters.sortBy === 'slots' ? 'selected' : ''}>Most Available</option>
                </select>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-slate-400 font-semibold">Budget:</span>
                <select onchange="app.setBudgetFilter(this.value)" class="font-bold text-slate-800 bg-transparent focus:outline-none">
                  <option value="all" ${this.exploreFilters.budget === 'all' ? 'selected' : ''}>All Budgets</option>
                  <option value="free" ${this.exploreFilters.budget === 'free' ? 'selected' : ''}>Free (RM0)</option>
                  <option value="under10" ${this.exploreFilters.budget === 'under10' ? 'selected' : ''}>Under RM10</option>
                </select>
              </div>
            </div>

            <div class="space-y-3">
              ${filtered.length > 0 ? (
                filtered.map(act => this.renderActivityCard(act, act.needsReplacement)).join('')
              ) : `
                <div class="bg-white border border-slate-200 rounded-3xl p-8 text-center space-y-3">
                  <h3 class="font-bold text-slate-800 text-sm">No matching activities found</h3>
                  <p class="text-xs text-slate-500">Try resetting your filters or create a new activity for UMS students.</p>
                  <button onclick="app.resetFilters()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Reset Filters</button>
                </div>
              `}
            </div>
          </div>
        `;
      }

      // SCREEN D: Activity Details & Replacement Actions
      renderDetails() {
        const act = this.activities.find(a => a.id === this.selectedActivityId) || this.activities[0];
        const isSaved = this.user.savedActivityIds.includes(act.id);
        const isJoined = act.isJoined || this.user.joinedActivityIds.includes(act.id);

        return `
          <div class="space-y-4">
            <div class="h-48 w-full relative bg-slate-900">
              <img src="${act.imageUrl}" class="w-full h-full object-cover" alt="${act.title}" />
              <div class="absolute top-3 left-3 right-3 flex items-center justify-between">
                <button onclick="navigateTo('home')" class="px-3 py-1.5 rounded-full bg-white text-slate-800 font-bold text-xs flex items-center gap-1.5">
                  ${HUGE_ICONS.arrowLeft}
                  <span>Back</span>
                </button>
                <div class="flex items-center gap-2">
                  <button onclick="app.toggleSaveActivity('${act.id}')" class="px-3 py-1.5 rounded-full bg-white text-slate-800 font-bold text-xs flex items-center gap-1.5">
                    ${isSaved ? HUGE_ICONS.heartFilled : HUGE_ICONS.heartOutline}
                    <span>${isSaved ? 'Saved' : 'Save'}</span>
                  </button>
                  <button onclick="app.showReportModal('${act.id}')" class="px-3 py-1.5 rounded-full bg-white text-rose-700 font-bold text-xs flex items-center gap-1">

                    <span>Report</span>
                  </button>
                </div>
              </div>
              <div class="absolute bottom-3 left-4 right-4 text-white">
                <div class="flex items-center gap-2 mb-1">
                  <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-0.5 rounded-full">${act.categoryLabel}</span>
                  ${act.needsReplacement ? `<span class="bg-rose-600 text-white text-xs font-bold px-2.5 py-0.5 rounded-full">Replacement Needed</span>` : ''}
                </div>
                <h1 class="text-lg font-extrabold text-white">${act.title}</h1>
              </div>
            </div>

            <div class="px-4 space-y-3.5">
              <!-- Last-Minute Replacement Banner -->
              ${act.needsReplacement ? `
                <div class="bg-rose-50 rounded-3xl p-4 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-extrabold text-rose-900 flex items-center gap-1.5">
                      ${HUGE_ICONS.bolt}
                      <span>Urgent Replacement Slot Open</span>
                    </span>
                    <span class="text-xs font-bold bg-rose-200 text-rose-900 px-2 py-0.5 rounded-full">${act.replacementDetails?.deadlineMinutes || 30}m left</span>
                  </div>
                  <p class="text-xs text-rose-800">
                    <strong>Reason:</strong> ${act.replacementDetails?.reason || 'Last-minute participant cancellation'}.
                  </p>
                  <div class="flex items-center gap-2 pt-1">
                    <button onclick="app.openReplacementHub('${act.id}')" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-colors">

                </div>
              ` : `
                <div class="bg-slate-100 rounded-2xl p-3 flex items-center justify-between text-xs">
                  <span class="font-semibold text-slate-800">Someone cancelled last minute?</span>
                  <button onclick="app.publishNewReplacementRequest('${act.id}')" class="font-bold text-white bg-indigo-600 px-3 py-1.5 rounded-xl">

                    <span>Replacement Hub</span>

      // SCREEN E: Last-Minute Replacement Matching Modal
      openReplacementHub(activityId) {
        const act = this.activities.find(a => a.id === activityId) || this.activities[0];
        if (!act.replacementDetails) {
          act.needsReplacement = true;
          act.replacementDetails = {
            id: 'rep_' + Date.now(),
            slotIndex: act.maxParticipants,
            originalPlayerName: 'Last-Minute Dropout',
            reason: 'Unexpected academic tutorial clash',
            urgentNotice: 'Starts soon. 1 vacant slot open.',
            status: 'looking',
            createdAt: 'Just now',
            deadlineMinutes: 35,
            applicants: []
          };
        }
        const rep = act.replacementDetails;

        const html = `
          <div class="space-y-4 text-left">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <span class="text-xs font-bold text-rose-600 uppercase">Last-Minute Replacement Matching</span>
                <h3 class="text-base font-extrabold text-slate-900">${act.title}</h3>
              </div>
              <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-bold text-xs">Close</button>
            </div>

            <!-- Status Progression Bar -->
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2 text-xs">
              <span class="font-bold text-slate-500 block">Live Status Progression:</span>
              <div class="grid grid-cols-4 gap-1 text-center font-bold text-xs">
                <div class="p-1.5 rounded-lg ${rep.status === 'looking' ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-700'}">1. Looking</div>
                <div class="p-1.5 rounded-lg ${rep.status === 'applicants_available' ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-700'}">2. Applicants (${rep.applicants.length})</div>
                <div class="p-1.5 rounded-lg ${rep.status === 'confirmed' ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">3. Confirmed</div>
                <div class="p-1.5 rounded-lg ${rep.status === 'completed' ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'}">4. Completed</div>
              </div>
            </div>

            <div class="bg-rose-50 rounded-2xl p-3 text-xs text-rose-900 space-y-1">
              <div><strong>Venue:</strong> ${act.venue} (${act.time})</div>
              <div><strong>Reason:</strong> ${rep.reason}</div>
              <div><strong>Contribution:</strong> RM${act.estimatedContribution} • Host Reliability: ${act.organiser.reliabilityScore}/100</div>
            </div>

            <!-- Applicants List -->
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-extrabold text-slate-800">Interested Replacement Participants</h4>
                <button onclick="app.simulateNewApplicant('${act.id}')" class="text-xs font-bold text-indigo-600 hover:underline">
                  + Simulate New Applicant
                </button>
              </div>

              ${rep.applicants.length > 0 ? rep.applicants.map(appUser => `
                <div class="bg-white border border-slate-200 rounded-2xl p-3 flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <img src="${appUser.avatar}" class="w-9 h-9 rounded-full" alt="u" />
                    <div>
                      <h5 class="text-xs font-bold text-slate-900">${appUser.name}</h5>
                      <p class="text-xs text-emerald-700 font-semibold">${appUser.reliabilityScore}/100 Reliability</p>
                    </div>
                  </div>
                  ${rep.status === 'confirmed' ? `
                    <span class="text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-xl">Confirmed</span>
                  ` : `
                    <button onclick="app.confirmReplacementApplicant('${act.id}', '${appUser.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl">
                      Confirm Replacement
                    </button>
                  `}
                </div>
              `).join('') : `
                <div class="p-4 bg-slate-50 rounded-2xl text-center text-xs text-slate-500">
                  Waiting for nearby UMS students. Click <strong>"+ Simulate New Applicant"</strong> above to test.
                </div>
              `}
            </div>
          </div>
        `;
        openModal(html);
      }

      publishNewReplacementRequest(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act) return;
        act.needsReplacement = true;
        if (act.currentParticipants >= act.maxParticipants) {
          act.currentParticipants = act.maxParticipants - 1;
        }
        act.replacementDetails = {
          id: 'rep_' + Date.now(),
          slotIndex: act.maxParticipants,
          originalPlayerName: 'Withdrawn Participant',
          reason: 'Last-minute cancellation — urgent replacement needed',
          urgentNotice: '1 vacant slot open now.',
          status: 'looking',
          createdAt: 'Just now',
          deadlineMinutes: 40,
          applicants: []
        };
        this.render();
        this.openReplacementHub(activityId);
        this.toast('Replacement request published to nearby UMS students', 'info');
      }

      simulateNewApplicant(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act || !act.replacementDetails) return;
        const newCand = {
          id: 'usr_sim_' + Date.now(),
          name: 'Aiman Hakim (FKI)',
          avatar: createAvatarSvg('#2563eb', 'AH'),
          faculty: 'Faculty of Computing & Informatics',
          reliabilityScore: 95
        };
        act.replacementDetails.applicants.push(newCand);
        act.replacementDetails.status = 'applicants_available';
        this.openReplacementHub(activityId);
        this.toast('New student expressed interest in filling the slot', 'info');
      }

      confirmReplacementApplicant(activityId, applicantId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act || !act.replacementDetails) return;
        const applicant = act.replacementDetails.applicants.find(a => a.id === applicantId);
        if (!applicant) return;

        act.replacementDetails.status = 'confirmed';
        act.needsReplacement = false;
        act.currentParticipants = act.maxParticipants;
        act.participants.push(applicant);

        this.notifications.unshift({
          id: 'notif_' + Date.now(),
          title: 'Your replacement has been confirmed',
          message: `${applicant.name} is confirmed for ${act.title}. Squad is now full (${act.currentParticipants}/${act.maxParticipants}).`,
          timestamp: 'Just now',
          isRead: false,
          type: 'replacement',
          targetActivityId: act.id
        });

        closeModal();
        this.render();
        this.toast(`Replacement confirmed: ${applicant.name} joined ${act.title}`, 'success');
      }

      // SCREEN F: Create Activity
      renderCreate() {
        const d = this.createDraft;
        return `
          <div class="p-4 space-y-4">
            <div>

            <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-3 text-xs">

                  <label class="font-bold text-slate-800 block mb-1">Required Pax</label>
                  <input type="number" value="${d.maxParticipants}" oninput="app.updateCreateDraft('maxParticipants', parseInt(this.value)||2)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
                <div>
                  <label class="font-bold text-slate-800 block mb-1">Est. Fee (RM)</label>
                  <input type="number" value="${d.estimatedContribution}" oninput="app.updateCreateDraft('estimatedContribution', parseInt(this.value)||0)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
              </div>

              <div>
                <label class="font-bold text-slate-800 block mb-1">Description</label>
                <textarea rows="2" oninput="app.updateCreateDraft('description', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5">${d.description}</textarea>

            <div>
              <span class="text-xs font-extrabold text-slate-400 uppercase tracking-wider block mb-2">Live Activity Card Preview</span>

                ${this.renderPreviewCard()}
              </div>

            <button onclick="app.submitNewActivity()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs transition-colors">
              Publish Activity to UMS Feed
            </button>
          </div>

      }

      updateCreateDraft(field, val) {
        this.createDraft[field] = val;
        const box = document.getElementById('live-preview-box');
        if (box) box.innerHTML = this.renderPreviewCard();
      }

      renderPreviewCard() {
        const d = this.createDraft;
        const previewAct = {
          id: 'preview',
          title: d.title || 'New Campus Activity',
          category: d.category,
          categoryLabel: d.category.toUpperCase(),
          imageUrl: CATEGORY_BANNERS[d.category] || CATEGORY_BANNERS.futsal,
          date: d.date,
          time: d.time,
          venue: d.venue,
          skillLevelLabel: 'All Welcome',
          currentParticipants: d.currentParticipants,
          maxParticipants: d.maxParticipants,
          estimatedContribution: d.estimatedContribution,
          needsReplacement: (d.maxParticipants - d.currentParticipants) === 1,
          organiser: {
            name: this.user.name,
            avatar: this.user.avatar,
            reliabilityScore: this.user.reliabilityScore
          }
        };
        return this.renderActivityCard(previewAct, previewAct.needsReplacement);
      }

      submitNewActivity() {
        const d = this.createDraft;
        if (!d.title.trim()) {
          this.toast('Please enter an activity name', 'error');
          return;
        }
        const newAct = {
          id: 'act_' + Date.now(),
          title: d.title,
          category: d.category,
          categoryLabel: d.category.toUpperCase(),
          imageUrl: CATEGORY_BANNERS[d.category] || CATEGORY_BANNERS.futsal,
          date: d.date,
          time: d.time,
          endTime: d.endTime,
          venue: d.venue,
          venueDetails: 'Organised by ' + this.user.name,
          campusArea: 'UMS Campus',
          currentParticipants: d.currentParticipants,
          maxParticipants: d.maxParticipants,
          needsReplacement: (d.maxParticipants - d.currentParticipants) === 1,
          estimatedContribution: d.estimatedContribution,
          contributionNote: d.estimatedContribution === 0 ? 'Free session' : `RM${d.estimatedContribution} estimated contribution per participant`,
          commitmentDeposit: 0,
          skillLevel: d.skillLevel,
          skillLevelLabel: 'Open to All',
          description: d.description,
          cancellationPolicy: 'Please notify at least 2 hours before start time.',
          isJoined: true,
          organiser: {
            id: this.user.id,
            name: this.user.name,
            avatar: this.user.avatar,
            faculty: this.user.faculty,
            reliabilityScore: this.user.reliabilityScore,
            isOrganiser: true
          },
          participants: [
            { id: this.user.id, name: this.user.name + ' (Host)', avatar: this.user.avatar, reliabilityScore: this.user.reliabilityScore }
          ]
        };
        this.activities.unshift(newAct);
        this.user.joinedActivityIds.push(newAct.id);

        navigateTo('details');
        this.toast('Activity created and added to UMS Home & Explore feeds', 'success');

      // SCREEN G: Mood-Based Recommendations ("Find Your Vibe")
      renderVibe() {
        const s = this.vibeState;
        const matched = this.getVibeRecommendations();

        return `

                <span>Private by Default</span>
              </span>
            </div>

            <div class="bg-slate-900 rounded-3xl p-4 text-white space-y-1">
              <span class="text-xs font-bold text-emerald-400 uppercase flex items-center gap-1.5">
                ${HUGE_ICONS.sparkles}
                <span>Find Your Vibe</span>
              </span>
              <h2 class="text-lg font-extrabold">Mood-Based Activity Discovery</h2>
              <p class="text-xs text-slate-300">Select your current mood and preferred interaction style below.</p>
            </div>

            <!-- Step 1: Mood -->
            <div class="bg-white border border-slate-200 rounded-3xl p-4 space-y-2.5 text-xs">
              <h4 class="font-extrabold text-slate-900">Step 1: How are you feeling today?</h4>

                  { id: 'tired', label: 'Tired' },

                ].map(m => `

                `).join('')}

              <div class="grid grid-cols-2 gap-2">
                ${[
                  { id: 'active_group', label: 'Active group' },
                  { id: 'small_casual', label: 'Small, casual group' },
                  { id: 'quiet_low_pressure', label: 'Quiet & low-pressure' },
                  { id: 'study_others', label: 'Study with others' },

                ].map(i => `
                  <button onclick="app.setVibeInteraction('${i.id}')" class="p-2.5 rounded-xl border text-left font-semibold transition-colors ${s.interaction === i.id ? 'bg-emerald-600 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                    ${i.label}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Step 3: Explanation & Recommendations -->
            <div class="bg-slate-100 rounded-2xl p-3.5 text-xs text-slate-900 space-y-1">
              <div class="font-extrabold text-indigo-700">Why these suit your vibe (${s.mood.toUpperCase()}):</div>
              <p class="leading-relaxed text-slate-700">${this.getVibeExplanation(s.mood)}</p>
              <p class="text-xs text-slate-500 pt-1">
                Note: Mood responses are private lifestyle suggestions, never displayed publicly or included in your reliability score.
              </p>

      setVibeMood(m) {
        this.vibeState.mood = m;
        this.render();
      }

      setVibeInteraction(i) {
        this.vibeState.interaction = i;
        this.render();
      }

      getVibeExplanation(mood) {
        const map = {
          energetic: 'Since you feel Energetic, high-tempo games like Futsal, Badminton, Basketball, or Running are great ways to channel your momentum.',
          happy: 'You are in a Happy mood. Group sports and social hangouts around UMS are great for sharing good energy with peers.',
          calm: 'For a Calm state of mind, study groups at UMS Library or a scenic sunset walk/jog at ODEC Beach offer steady, focused company.',
          tired: 'Feeling Tired after lectures? Relaxed hangouts or low-intensity study pods let you socialise without physical exhaustion.',
          stressed: 'Feeling Stressed? Optional light exercise like a sunset coastal run or a low-pressure board game hangout can help you unwind.'
        };
        return map[mood] || map.energetic;
      }

      getVibeRecommendations() {
        const m = this.vibeState.mood;
        if (m === 'energetic') return this.activities.filter(a => ['futsal', 'badminton', 'basketball', 'running'].includes(a.category));
        if (m === 'happy') return this.activities.filter(a => ['hangout', 'badminton', 'futsal'].includes(a.category));
        if (m === 'calm') return this.activities.filter(a => ['study', 'running', 'hangout'].includes(a.category));
        if (m === 'tired') return this.activities.filter(a => ['hangout', 'study'].includes(a.category));
        if (m === 'stressed') return this.activities.filter(a => ['running', 'hangout', 'badminton'].includes(a.category));
        return this.activities;
      }

        openModal(html);

      confirmJoin(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act) return;
        if (!act.participants.some(p => p.id === this.user.id)) {
          act.participants.push({
            id: this.user.id,
            name: this.user.name + ' (You)',
            avatar: this.user.avatar,
            reliabilityScore: this.user.reliabilityScore
          });
          act.currentParticipants = Math.min(act.currentParticipants + 1, act.maxParticipants);
        }
        act.isJoined = true;
        act.needsReplacement = false;
        if (!this.user.joinedActivityIds.includes(act.id)) {
          this.user.joinedActivityIds.push(act.id);
        }
        closeModal();
        this.render();
        this.toast(`Confirmed for ${act.title}. Participant count updated.`, 'success');
      }

        } else {
          this.user.savedActivityIds.push(activityId);
          this.toast('Activity saved to your list', 'success');
        }
        this.render();

      }

      setBudgetFilter(val) {
        this.exploreFilters.budget = val;
        this.render();
      }

      resetFilters() {
        this.exploreFilters = {
          searchQuery: '',
          category: 'all',
          skillLevel: 'all',
          budget: 'all',
          onlyReplacements: false,
          sortBy: 'recommended'
        };
        this.render();
      }
    }

    const app = new ActiMateApp();

    function navigateTo(screen) {
      app.currentScreen = screen;
      app.render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(html) {
      const c = document.getElementById('modal-container');
      const m = document.getElementById('modal-content');
      if (!c || !m) return;
      m.innerHTML = html;
      c.classList.remove('hidden');
      c.classList.add('flex');
    }

    function closeModal() {
      const c = document.getElementById('modal-container');
      if (!c) return;
      c.classList.add('hidden');
      c.classList.remove('flex');
    }

    function toggleDeviceView() {
      const wrapper = document.getElementById('app-wrapper');
      const nav = document.getElementById('bottom-nav');
      const label = document.getElementById('view-mode-label');
      if (!wrapper || !label) return;
      if (wrapper.classList.contains('max-w-[430px]')) {
        wrapper.classList.remove('max-w-[430px]');
        wrapper.classList.add('max-w-4xl');
        if (nav) {
          nav.classList.remove('max-w-[430px]');
          nav.classList.add('max-w-4xl');
        }
        label.innerText = 'Desktop View';
      } else {
        wrapper.classList.add('max-w-[430px]');
        wrapper.classList.remove('max-w-4xl');
        if (nav) {
          nav.classList.add('max-w-[430px]');
          nav.classList.remove('max-w-4xl');
        }
        label.innerText = 'Mobile View';
      }
    }

    function resetMockData() {
      app.resetData();
    }

    function openVibeFlow() {
      navigateTo('vibe');
    }

    // Render immediately
    app.render();
  </script>
</body>
</html>
