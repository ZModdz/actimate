<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0f172a">
  <title>ActiMate — UMS Activity & Replacement Matching</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes astryxFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .astryx-view {
      animation: astryxFade 0.16s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-900 antialiased min-h-screen flex flex-col items-center justify-start p-0 sm:py-3 sm:px-4">

  <!-- Top Presenter Toolbar (Compact, Direct Verb Controls) -->
  <header class="w-full max-w-5xl mb-2.5 hidden sm:flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-white">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs">
        A
      </div>
      <div class="flex items-center gap-2">
        <span class="font-bold text-sm text-white">ActiMate</span>
        <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">UMS Campus</span>
        <span class="text-xs text-slate-400">Meta Astryx UI</span>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <button onclick="navigateTo('onboarding')" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors">
        Open Welcome
      </button>
      <button onclick="toggleDeviceView()" id="btn-device-view" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors">
        <span id="view-mode-label">Switch to Wide View</span>
      </button>
      <button onclick="resetMockData()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors">
        Reset State
      </button>
    </div>
  </header>

  <!-- Main App Surface (Preserved 430px Mobile Geometry) -->
  <main id="app-wrapper" class="w-full max-w-[430px] bg-slate-50 min-h-screen sm:rounded-t-2xl sm:border-x sm:border-t sm:border-slate-800 relative flex flex-col pb-20">
    
    <!-- Sticky Status & Context Bar -->
    <div class="bg-white px-4 py-2.5 flex items-center justify-between text-xs border-b border-slate-200 sticky top-0 z-40">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-900">ActiMate</span>
        <span class="text-slate-300">|</span>
        <span class="font-medium text-slate-600">UMS Kota Kinabalu</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="app.showReliabilityModal()" class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-800 flex items-center gap-1">
          <span>Reliability:</span>
          <span id="header-reliability" class="font-bold text-emerald-700">92/100</span>
        </button>
        <button onclick="navigateTo('onboarding')" class="text-xs font-semibold text-indigo-600 hover:underline">
          Account
        </button>
      </div>
    </div>

    <!-- Active View Container -->
    <div id="screen-container" class="flex-1 bg-slate-50"></div>

  </main>

  <!-- Fixed Bottom Navigation Bar -->
  <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-slate-200 sm:border-x sm:border-x-slate-800 px-2 py-1.5 flex items-center justify-around z-50">
    
    <button onclick="navigateTo('home')" id="nav-btn-home" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 rounded-lg transition-colors text-indigo-600 font-bold">

      <span class="text-xs">Home</span>
    </button>

    <button onclick="navigateTo('explore')" id="nav-btn-explore" class="nav-item flex flex-col items-center gap-0.5 py-1 px-3 rounded-lg transition-colors text-slate-500 hover:text-slate-900">

      <div class="relative">

      </div>

      toast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const el = document.createElement('div');
        const bg = type === 'success' ? 'bg-emerald-700 text-white' : type === 'info' ? 'bg-slate-900 text-white' : 'bg-rose-700 text-white';
        el.className = `astryx-view ${bg} px-3.5 py-2.5 rounded-xl flex items-center justify-between gap-2 text-xs font-medium pointer-events-auto border border-slate-700`;
        el.innerHTML = `
          <span>${message}</span>
          <button onclick="this.parentElement.remove()" class="font-bold underline ml-2 shrink-0">Dismiss</button>
        `;
        container.appendChild(el);
        setTimeout(() => {
          if (el && el.parentElement) el.remove();
        }, 3200);
      }

      render() {
        const container = document.getElementById('screen-container');
        if (!container) return;

        const relEl = document.getElementById('header-reliability');
        if (relEl) relEl.textContent = `${this.user.reliability}/100`;

        this.updateNavHighlight();

        let html = '';
        switch (this.currentScreen) {
          case 'onboarding': html = this.renderOnboarding(); break;
          case 'home': html = this.renderHome(); break;
          case 'explore': html = this.renderExplore(); break;
          case 'create': html = this.renderCreate(); break;
          case 'inbox': html = this.renderInbox(); break;
          case 'profile': html = this.renderProfile(); break;
          case 'details': html = this.renderDetails(); break;
          case 'vibe': html = this.renderVibe(); break;
          case 'subscription': html = this.renderSubscription(); break;
          case 'settings': html = this.renderSettings(); break;
          default: html = this.renderHome();
        }
        container.innerHTML = `<div class="astryx-view">${html}</div>`;

      updateNavHighlight() {
        const navButtons = document.querySelectorAll('.nav-item');
        navButtons.forEach(btn => {
          btn.classList.remove('text-indigo-600', 'font-bold');
          btn.classList.add('text-slate-500');
        });

        const map = {
          home: 'nav-btn-home',
          explore: 'nav-btn-explore',
          create: 'nav-btn-create',
          inbox: 'nav-btn-inbox',
          profile: 'nav-btn-profile'
        };
        const activeId = map[this.currentScreen];
        if (activeId) {

      // SCREEN C: Explore & Filter Activities
      renderExplore() {
        const f = this.filters;
        const hasActiveFilter = f.query !== '' || f.category !== 'all' || f.budget !== 'all' || f.onlyReplacements;

        let list = this.activities.filter(a => {
          if (f.query) {
            const q = f.query.toLowerCase();
            if (!a.title.toLowerCase().includes(q) && !a.venue.toLowerCase().includes(q) && !a.categoryLabel.toLowerCase().includes(q)) return false;
          }
          if (f.category !== 'all' && a.category !== f.category) return false;
          if (f.budget === 'free' && a.fee > 0) return false;
          if (f.budget === 'under10' && a.fee > 10) return false;
          if (f.onlyReplacements && !a.needsReplacement) return false;
          return true;
        });

        if (f.sortBy === 'slots') {
          list.sort((a, b) => (b.maxSlots - b.currentSlots) - (a.maxSlots - a.currentSlots));
        }

        return `
          <div class="p-3.5 space-y-3">

                  ` : ''}

              </div>

                type="text"

                <button onclick="app.toggleReplacementFilter()" class="shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-semibold ${f.onlyReplacements ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-700'}">
                  Replacement open
                </button>
                ${[
                  { id: 'all', label: 'All' },
                  { id: 'futsal', label: 'Futsal' },
                  { id: 'badminton', label: 'Badminton' },
                  { id: 'basketball', label: 'Basketball' },
                  { id: 'running', label: 'Running' },
                  { id: 'study', label: 'Study' },
                  { id: 'hangout', label: 'Hangout' }
                ].map(c => `
                  <button onclick="app.setExploreCategory('${c.id}')" class="shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-semibold ${f.category === c.id ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}">
                    ${c.label}
                  </button>
                `).join('')}
              </div>

              <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100 text-xs">
                <div class="flex items-center justify-between bg-slate-50 px-2.5 py-1.5 rounded-lg">
                  <span class="text-slate-500">Sort:</span>
                  <select onchange="app.setSortBy(this.value)" class="font-semibold text-slate-900 bg-transparent focus:outline-none">
                    <option value="recommended" ${f.sortBy === 'recommended' ? 'selected' : ''}>Recommended</option>
                    <option value="slots" ${f.sortBy === 'slots' ? 'selected' : ''}>Open slots</option>
                  </select>
                </div>
                <div class="flex items-center justify-between bg-slate-50 px-2.5 py-1.5 rounded-lg">
                  <span class="text-slate-500">Fee:</span>
                  <select onchange="app.setBudgetFilter(this.value)" class="font-semibold text-slate-900 bg-transparent focus:outline-none">
                    <option value="all" ${f.budget === 'all' ? 'selected' : ''}>Any fee</option>
                    <option value="free" ${f.budget === 'free' ? 'selected' : ''}>Free (RM0)</option>
                    <option value="under10" ${f.budget === 'under10' ? 'selected' : ''}>RM10 or less</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Filtered Activity List -->
            <div class="space-y-2">
              ${list.length > 0 ? (
                list.map(act => this.renderActivityRow(act)).join('')
              ) : `
                <div class="bg-white border border-slate-200 rounded-xl p-6 text-center space-y-2">
                  <p class="text-xs font-bold text-slate-900">No activities match your current filters.</p>
                  <p class="text-xs text-slate-500">Reset filters to view all UMS activities or create a new activity.</p>
                  <div class="pt-1 flex justify-center gap-2">
                    <button onclick="app.resetFilters()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold">Reset filters</button>
                    <button onclick="navigateTo('create')" class="px-3 py-1.5 bg-slate-100 text-slate-800 rounded-lg text-xs font-bold">Create activity</button>
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      }

      // SCREEN D: Activity Details & Immediate Slot/Replacement Controls
      renderDetails() {
        const act = this.activities.find(a => a.id === this.selectedActivityId) || this.activities[0];
        const openSlots = act.maxSlots - act.currentSlots;
        const isSaved = this.user.savedIds.includes(act.id);
        const isJoined = act.isJoined || this.user.joinedIds.includes(act.id);
        const applicants = act.replacement?.applicants || [];

        return `
          <div class="p-3.5 space-y-3">
            <!-- Top Action Bar -->
            <div class="flex items-center justify-between">
              <button onclick="navigateTo('home')" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-800 font-semibold text-xs flex items-center gap-1">
                ${ICONS.arrowLeft}
                <span>Back</span>
              </button>
              <div class="flex items-center gap-1.5">
                <button onclick="app.toggleSave('${act.id}')" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-800 font-semibold text-xs flex items-center gap-1">
                  ${isSaved ? ICONS.bookmarkFilled : ICONS.bookmark}
                  <span>${isSaved ? 'Saved' : 'Save'}</span>
                </button>
                <button onclick="app.openReportModal()" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-rose-700 font-semibold text-xs">
                  Report
                </button>
              </div>
            </div>

            <!-- Primary Activity Summary Card -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <span class="bg-slate-100 text-slate-800 text-xs font-semibold px-2 py-0.5 rounded flex items-center gap-1">
                  ${this.getIcon(act.category)}
                  <span>${act.categoryLabel}</span>
                </span>
                <span class="text-xs font-bold ${isJoined ? 'text-emerald-700 bg-emerald-50' : act.needsReplacement ? 'text-white bg-rose-600' : 'text-slate-700 bg-slate-100'} px-2 py-0.5 rounded">
                  ${isJoined ? 'State: Joined' : act.needsReplacement ? 'State: Replacement open' : `State: ${openSlots} slots open`}
                </span>
              </div>

              <div>
                <h1 class="text-base font-bold text-slate-900">${act.title}</h1>
                <p class="text-xs text-slate-600 mt-0.5">${act.date}, ${act.time} – ${act.endTime} • ${act.venue}</p>
              </div>

              <!-- Key Metrics Grid -->
              <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2.5 rounded-lg text-xs">
                <div>
                  <span class="text-slate-500 block">Slots</span>
                  <span class="font-bold text-slate-900">${act.currentSlots}/${act.maxSlots} filled</span>
                </div>
                <div>
                  <span class="text-slate-500 block">Fee</span>
                  <span class="font-bold text-slate-900">${act.fee === 0 ? 'Free' : `RM${act.fee}`}</span>
                </div>
                <div>
                  <span class="text-slate-500 block">Deposit</span>
                  <span class="font-bold text-slate-900">${act.deposit === 0 ? 'None' : `RM${act.deposit}`}</span>
                </div>
              </div>

              <!-- Primary Action Control Placed Directly With State -->
              <div class="flex items-center gap-2 pt-1">
                ${isJoined ? `
                  <button onclick="app.openChatForActivity('${act.id}')" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-lg transition-colors">
                    Open activity chat
                  </button>
                  <button onclick="app.leaveActivity('${act.id}')" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition-colors">
                    Cancel slot
                  </button>
                ` : openSlots > 0 ? `
                  <button onclick="app.openJoinModal('${act.id}')" class="w-full py-2.5 ${act.needsReplacement ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white font-bold text-xs rounded-lg transition-colors">
                    ${act.needsReplacement ? `Fill replacement slot (${act.fee === 0 ? 'Free' : 'RM' + act.fee})` : `Join activity (${act.fee === 0 ? 'Free' : 'RM' + act.fee})`}
                  </button>
                ` : `
                  <div class="w-full py-2 bg-slate-100 text-slate-500 font-semibold text-xs rounded-lg text-center">
                    All slots are filled.
                  </div>
                `}
              </div>
            </div>

            <!-- Inline Replacement Control Panel (Controls Close to Affected Content) -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-2.5 text-xs">
              <div class="flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-slate-900">Replacement status</h3>
                  <p class="text-slate-500">
                    ${act.needsReplacement 
                      ? `${openSlots} replacement slot is open (${act.replacement?.deadlineMinutes || 30}m remaining).` 
                      : 'No replacement is currently requested for this activity.'}
                  </p>
                </div>
                ${!act.needsReplacement ? `
                  <button onclick="app.requestReplacement('${act.id}')" class="px-2.5 py-1.5 bg-slate-900 text-white font-bold rounded-lg shrink-0">
                    Request replacement
                  </button>
                ` : `
                  <button onclick="app.simulateApplicant('${act.id}')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold rounded-lg shrink-0">
                    + Add test applicant
                  </button>
                `}
              </div>

              ${act.needsReplacement ? `
                <div class="bg-slate-50 p-2.5 rounded-lg text-slate-700">
                  <strong>Reason:</strong> ${act.replacement?.reason || 'Participant cancelled before start time.'}
                </div>

                <div class="space-y-1.5 pt-1">
                  <span class="font-semibold text-slate-700 block">Applicants (${applicants.length})</span>
                  ${applicants.length > 0 ? applicants.map(cand => `
                    <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-lg">
                      <div class="flex items-center gap-2">
                        <img src="${cand.avatar}" class="w-7 h-7 rounded-full" alt="u" />
                        <div>
                          <span class="font-bold text-slate-900 block">${cand.name}</span>
                          <span class="text-emerald-700 font-medium">${cand.reliability}/100 reliability • ${cand.faculty}</span>
                        </div>
                      </div>
                      <button onclick="app.approveReplacement('${act.id}', '${cand.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition-colors">
                        Approve
                      </button>
                    </div>
                  `).join('') : `
                    <p class="text-slate-500 py-1">No applicants yet. Click "+ Add test applicant" above to test approval.</p>
                  `}
                </div>
              ` : ''}
            </div>

            <!-- Host & Description -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-2.5 text-xs">
              <div class="flex items-center justify-between pb-2.5 border-b border-slate-100">
                <div class="flex items-center gap-2.5">
                  <img src="${act.host.avatar}" class="w-8 h-8 rounded-full" alt="host" />
                  <div>
                    <span class="font-bold text-slate-900 block">${act.host.name} (Host)</span>
                    <span class="text-slate-500">${act.host.faculty}</span>
                  </div>
                </div>
                <span class="font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded">${act.host.reliability}/100 reliability</span>
              </div>

              <div class="space-y-1">
                <span class="font-bold text-slate-900 block">Details</span>
                <p class="text-slate-600 leading-relaxed">${act.description}</p>
                <p class="text-slate-500 pt-1"><strong>Fee note:</strong> ${act.feeNote}</p>
                <p class="text-slate-500"><strong>Cancellation rule:</strong> ${act.cancellationPolicy}</p>
              </div>
            </div>

            <!-- Slot Roster -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-2 text-xs">
              <div class="flex items-center justify-between">
                <span class="font-bold text-slate-900">Confirmed slots (${act.currentSlots}/${act.maxSlots})</span>
                <span class="text-slate-500">${openSlots} open</span>
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${act.participants.map(p => `
                  <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-2 py-1 rounded-lg">
                    <img src="${p.avatar}" class="w-4 h-4 rounded-full" alt="p" />
                    <span class="font-medium text-slate-800">${p.name}</span>
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        `;
      }

      // SCREEN F: Create Activity (Compact Form + Immediate Live Row Preview)
      renderCreate() {
        const d = this.draft;
        return `
          <div class="p-3.5 space-y-3">
            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3 text-xs">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-900">Create activity</h2>
                <span class="text-slate-500">Host: ${this.user.name}</span>
              </div>

              <div>
                <label class="font-semibold text-slate-700 block mb-1">Activity title</label>
                <input type="text" value="${d.title}" oninput="app.updateDraft('title', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 font-medium text-slate-900" />
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="font-semibold text-slate-700 block mb-1">Category</label>
                  <select onchange="app.updateDraft('category', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2 font-medium text-slate-900">
                    <option value="futsal" ${d.category === 'futsal' ? 'selected' : ''}>Futsal</option>
                    <option value="badminton" ${d.category === 'badminton' ? 'selected' : ''}>Badminton</option>
                    <option value="basketball" ${d.category === 'basketball' ? 'selected' : ''}>Basketball</option>
                    <option value="running" ${d.category === 'running' ? 'selected' : ''}>Running &amp; Gym</option>
                    <option value="study" ${d.category === 'study' ? 'selected' : ''}>Study</option>
                    <option value="hangout" ${d.category === 'hangout' ? 'selected' : ''}>Hangout</option>
                  </select>
                </div>
                <div>
                  <label class="font-semibold text-slate-700 block mb-1">Skill level</label>
                  <select onchange="app.updateDraft('skillLevel', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2 font-medium text-slate-900">
                    <option value="all">All levels</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="competitive">Competitive</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="font-semibold text-slate-700 block mb-1">Date</label>
                  <input type="text" value="${d.date}" oninput="app.updateDraft('date', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2" />
                </div>
                <div>
                  <label class="font-semibold text-slate-700 block mb-1">Start time</label>
                  <input type="text" value="${d.time}" oninput="app.updateDraft('time', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2" />
                </div>
              </div>

              <div>
                <label class="font-semibold text-slate-700 block mb-1">UMS venue</label>
                <input type="text" value="${d.venue}" oninput="app.updateDraft('venue', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2" />
              </div>

              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="font-semibold text-slate-700 block mb-1">Filled slots</label>
                  <input type="number" value="${d.currentSlots}" oninput="app.updateDraft('currentSlots', parseInt(this.value)||1)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2" />
                </div>
                <div>
                  <label class="font-semibold text-slate-700 block mb-1">Total slots</label>
                  <input type="number" value="${d.maxSlots}" oninput="app.updateDraft('maxSlots', parseInt(this.value)||2)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2" />
                </div>
                <div>
                  <label class="font-semibold text-slate-700 block mb-1">Fee (RM)</label>
                  <input type="number" value="${d.fee}" oninput="app.updateDraft('fee', parseInt(this.value)||0)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2" />
                </div>
              </div>

              <div>
                <label class="font-semibold text-slate-700 block mb-1">Description</label>
                <textarea rows="2" oninput="app.updateDraft('description', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5">${d.description}</textarea>
              </div>

              <button onclick="app.publishActivity()" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition-colors">
                Publish activity
              </button>
            </div>

            <!-- Live Preview Directly Below Form -->
            <div class="space-y-1.5">
              <span class="text-xs font-bold text-slate-500 uppercase tracking-wide block">Live preview</span>
              <div id="live-preview-box">
                ${this.renderPreviewRow()}
              </div>
            </div>
          </div>
        `;
      }

      updateDraft(field, val) {
        this.draft[field] = val;
        const box = document.getElementById('live-preview-box');
        if (box) box.innerHTML = this.renderPreviewRow();
      }

      renderPreviewRow() {
        const d = this.draft;
        const preview = {
          id: 'preview',
          title: d.title || 'Untitled Activity',
          category: d.category,
          categoryLabel: d.category.charAt(0).toUpperCase() + d.category.slice(1),
          date: d.date,
          time: d.time,
          venue: d.venue,
          skillLevelLabel: d.skillLevel,
          currentSlots: d.currentSlots,
          maxSlots: d.maxSlots,
          fee: d.fee,
          needsReplacement: (d.maxSlots - d.currentSlots) === 1,
          host: {
            name: this.user.name,
            avatar: this.user.avatar,
            reliability: this.user.reliability
          }
        };
        return this.renderActivityRow(preview);
      }

      publishActivity() {
        const d = this.draft;
        if (!d.title.trim()) {
          this.toast('Enter an activity title before publishing.', 'error');
          return;
        }
        const newAct = {
          id: 'act_' + Date.now(),
          title: d.title.trim(),
          category: d.category,
          categoryLabel: d.category.charAt(0).toUpperCase() + d.category.slice(1),
          date: d.date,
          time: d.time,
          endTime: d.endTime,
          venue: d.venue,
          skillLevel: d.skillLevel,
          skillLevelLabel: d.skillLevel,
          currentSlots: d.currentSlots,
          maxSlots: d.maxSlots,
          needsReplacement: (d.maxSlots - d.currentSlots) === 1,
          fee: d.fee,
          feeNote: d.fee === 0 ? 'Free activity.' : `RM${d.fee} per slot.`,
          deposit: 0,
          description: d.description,
          cancellationPolicy: 'Cancel at least 2 hours before start time.',
          isJoined: true,
          host: {
            id: this.user.id,
            name: this.user.name,
            avatar: this.user.avatar,
            faculty: this.user.faculty,
            reliability: this.user.reliability
          },
          replacement: {
            reason: 'Host opened 1 replacement slot.',
            deadlineMinutes: 60,
            status: 'looking',
            applicants: []
          },
          participants: [
            { id: this.user.id, name: `${this.user.name} (Host)`, avatar: this.user.avatar, reliability: this.user.reliability }
          ]
        };
        this.activities.unshift(newAct);
        this.user.joinedIds.push(newAct.id);
        this.selectedActivityId = newAct.id;
        navigateTo('details');
        this.toast('Activity published. Share or manage slots below.', 'success');
      }

      // SCREEN G: Mood & Interaction Preferences
      renderVibe() {
        const mood = this.user.mood || 'energetic';
        const interaction = this.user.interaction || 'no_preference';
        const matches = this.getMoodMatches(mood);

        return `
          <div class="p-3.5 space-y-3">
            <div class="flex items-center justify-between">
              <button onclick="navigateTo('home')" class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-800 font-semibold text-xs flex items-center gap-1">
                ${ICONS.arrowLeft}
                <span>Back</span>
              </button>
              <span class="text-xs text-slate-500">Private mood preferences</span>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3 text-xs">
              <div>
                <h2 class="text-sm font-bold text-slate-900">Match activities to your mood</h2>
                <p class="text-slate-500">Select your current mood and group preference to filter the list below.</p>
              </div>

              <div class="space-y-1.5">
                <span class="font-semibold text-slate-700 block">1. Select mood</span>
                <div class="grid grid-cols-5 gap-1.5">
                  ${['energetic', 'happy', 'calm', 'tired', 'stressed'].map(m => `
                    <button onclick="app.setMoodFilter('${m}')" class="py-2 px-1 rounded-lg border font-semibold capitalize transition-colors ${mood === m ? 'bg-indigo-600 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                      ${m}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="space-y-1.5">
                <span class="font-semibold text-slate-700 block">2. Select group preference</span>
                <div class="grid grid-cols-2 gap-1.5">
                  ${[
                    { id: 'active_group', label: 'Active group' },
                    { id: 'small_casual', label: 'Small group (2–5)' },
                    { id: 'quiet_low_pressure', label: 'Low-pressure' },
                    { id: 'study_others', label: 'Study group' },
                    { id: 'no_preference', label: 'No preference' }
                  ].map(i => `
                    <button onclick="app.setInteractionFilter('${i.id}')" class="p-2 rounded-lg border text-left font-semibold transition-colors ${interaction === i.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                      ${i.label}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="bg-slate-50 p-2.5 rounded-lg text-slate-700">
                <strong>Match reason (${mood}):</strong> ${this.getMoodReason(mood)}
              </div>
            </div>

            <div class="space-y-2">
              <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-slate-900 uppercase tracking-wide">Matched activities (${matches.length})</span>
                <button onclick="app.setMoodFilter(null); navigateTo('home');" class="font-semibold text-slate-600 hover:underline">Clear mood filter</button>
              </div>
              ${matches.map(act => this.renderActivityRow(act)).join('')}
            </div>
          </div>
        `;
      }

      getMoodReason(mood) {
        const reasons = {
          energetic: 'Shows high-tempo team sports and fitness activities.',
          happy: 'Shows group sports and social hangouts.',
          calm: 'Shows quiet study sessions and easy outdoor runs.',
          tired: 'Shows low-intensity hangouts and seated study groups.',
          stressed: 'Shows light outdoor runs and casual social activities.'
        };
        return reasons[mood] || reasons.energetic;
      }

      getMoodMatches(mood) {
        if (mood === 'energetic') return this.activities.filter(a => ['futsal', 'badminton', 'basketball', 'running'].includes(a.category));
        if (mood === 'happy') return this.activities.filter(a => ['hangout', 'badminton', 'futsal'].includes(a.category));
        if (mood === 'calm') return this.activities.filter(a => ['study', 'running', 'hangout'].includes(a.category));
        if (mood === 'tired') return this.activities.filter(a => ['hangout', 'study'].includes(a.category));
        if (mood === 'stressed') return this.activities.filter(a => ['running', 'hangout', 'badminton'].includes(a.category));
        return this.activities;
      }

      setMoodFilter(mood) {
        this.user.mood = mood;
        this.render();
      }

      setInteractionFilter(interaction) {
        this.user.interaction = interaction;
        this.render();
      }

      // SCREEN H: Inbox (Notifications & Activity Chats)
      renderInbox() {
        const unreadCount = this.notifications.filter(n => !n.isRead).length;
        return `
          <div class="p-3.5 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold text-slate-900">Inbox</h2>
              ${this.activeInboxTab === 'notifications' && unreadCount > 0 ? `
                <button onclick="app.markAllNotificationsRead()" class="text-xs font-semibold text-indigo-600 hover:underline">Mark all read</button>
              ` : ''}
            </div>

            <div class="bg-slate-200 p-1 rounded-xl flex text-xs font-bold">
              <button onclick="app.setInboxTab('notifications')" class="flex-1 py-1.5 rounded-lg ${this.activeInboxTab === 'notifications' ? 'bg-white text-slate-900' : 'text-slate-600'}">
                Notifications (${this.notifications.length})
              </button>
              <button onclick="app.setInboxTab('messages')" class="flex-1 py-1.5 rounded-lg ${this.activeInboxTab === 'messages' ? 'bg-white text-slate-900' : 'text-slate-600'}">
                Chats (${this.conversations.length})
              </button>
            </div>

            ${this.activeInboxTab === 'notifications' ? `
              <div class="space-y-2">
                ${this.notifications.map(n => `
                  <div onclick="app.openNotification('${n.id}')" class="bg-white border border-slate-200 rounded-xl p-3 flex items-start justify-between gap-3 cursor-pointer hover:bg-slate-50 transition-colors">
                    <div class="space-y-0.5 text-xs">
                      <div class="flex items-center gap-1.5">

      openJoinModal(activityId) {

        if (!act) return;

            <div class="flex gap-2">
              <button onclick="closeModal()" class="flex-1 py-2 bg-slate-100 rounded-lg font-bold text-slate-700">Cancel</button>
              <button onclick="app.confirmJoin('${act.id}')" class="flex-1 py-2 bg-indigo-600 text-white rounded-lg font-bold">Confirm slot</button>
            </div>
          </div>
        `);
      }

      confirmJoin(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act) return;
        if (!act.participants.some(p => p.id === this.user.id)) {
          act.participants.push({
            id: this.user.id,
            name: `${this.user.name} (You)`,
            avatar: this.user.avatar,
            reliability: this.user.reliability
          });
          act.currentSlots = Math.min(act.currentSlots + 1, act.maxSlots);
        }
        act.isJoined = true;
        if (act.currentSlots >= act.maxSlots) {
          act.needsReplacement = false;
        }
        if (!this.user.joinedIds.includes(act.id)) {
          this.user.joinedIds.push(act.id);
        }
        closeModal();
        this.render();
        this.toast(`You joined ${act.title}. Open chat to coordinate with the host.`, 'success');
      }

      leaveActivity(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act) return;
        act.isJoined = false;
        this.user.joinedIds = this.user.joinedIds.filter(id => id !== activityId);
        act.participants = act.participants.filter(p => p.id !== this.user.id);
        act.currentSlots = Math.max(1, act.currentSlots - 1);
        act.needsReplacement = true;
        act.replacement = {
          reason: 'Participant cancelled slot.',
          deadlineMinutes: 45,
          status: 'looking',
          applicants: []
        };
        this.render();
        this.toast(`Slot cancelled for ${act.title}. Replacement slot is now open.`, 'info');
      }

      openReplacementModal(activityId) {
        this.selectedActivityId = activityId;
        this.currentScreen = 'details';
        this.render();
      }

      requestReplacement(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act) return;
        act.needsReplacement = true;
        if (act.currentSlots >= act.maxSlots) {
          act.currentSlots = act.maxSlots - 1;
        }
        act.replacement = {
          reason: 'Host opened a replacement slot.',
          deadlineMinutes: 40,
          status: 'looking',
          applicants: []
        };
        this.render();
        this.toast('Replacement slot opened. Add or approve an applicant below.', 'info');
      }

      simulateApplicant(activityId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act || !act.replacement) return;
        const cand = {
          id: 'usr_cand_' + Date.now(),
          name: 'Aiman Hakim',
          avatar: createAvatarSvg('#2563eb', 'AH'),
          faculty: 'FKI',
          reliability: 95
        };
        act.replacement.applicants.push(cand);
        act.replacement.status = 'applicants_available';
        this.render();
        this.toast('Aiman Hakim applied for the replacement slot. Click Approve to confirm.', 'info');
      }

      approveReplacement(activityId, applicantId) {
        const act = this.activities.find(a => a.id === activityId);
        if (!act || !act.replacement) return;
        const applicant = act.replacement.applicants.find(a => a.id === applicantId);
        if (!applicant) return;

        act.replacement.status = 'confirmed';
        act.needsReplacement = false;
        act.currentSlots = act.maxSlots;
        act.participants.push(applicant);

        this.notifications.unshift({
          id: 'notif_' + Date.now(),
          title: `Replacement approved: ${act.title}`,
          message: `${applicant.name} filled the open slot (${act.currentSlots}/${act.maxSlots}).`,
          timestamp: 'Just now',
          isRead: false,
          targetActivityId: act.id
        });

        this.render();
        this.toast(`${applicant.name} approved. All slots are now filled.`, 'success');
      }

      setExploreCategory(cat) {
        this.filters.category = cat;
        this.render();
      }

      toggleReplacementFilter() {
        this.filters.onlyReplacements = !this.filters.onlyReplacements;
        this.render();
      }

      setSortBy(val) {
        this.filters.sortBy = val;
        this.render();
      }

      setBudgetFilter(val) {
        this.filters.budget = val;
        this.render();
      }

      resetFilters() {
        this.filters = { query: '', category: 'all', budget: 'all', onlyReplacements: false, sortBy: 'recommended' };
        this.render();
      }
    }

    const app = new ActiMateApp();

    function navigateTo(screen) {
      app.currentScreen = screen;
      app.render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(html) {
      const c = document.getElementById('modal-container');
      const m = document.getElementById('modal-content');
      if (!c || !m) return;
      m.innerHTML = html;
      c.classList.remove('hidden');
      c.classList.add('flex');
    }

    function closeModal() {
      const c = document.getElementById('modal-container');
      if (!c) return;
      c.classList.add('hidden');
      c.classList.remove('flex');
    }

    function toggleDeviceView() {
      const wrapper = document.getElementById('app-wrapper');
      const nav = document.getElementById('bottom-nav');
      const label = document.getElementById('view-mode-label');
      if (!wrapper || !label) return;
      if (wrapper.classList.contains('max-w-[430px]')) {
        wrapper.classList.remove('max-w-[430px]');
        wrapper.classList.add('max-w-4xl');
        if (nav) {
          nav.classList.remove('max-w-[430px]');
          nav.classList.add('max-w-4xl');
        }
        label.innerText = 'Switch to Mobile View';
      } else {
        wrapper.classList.add('max-w-[430px]');
        wrapper.classList.remove('max-w-4xl');
        if (nav) {
          nav.classList.add('max-w-[430px]');
          nav.classList.remove('max-w-4xl');
        }
        label.innerText = 'Switch to Wide View';
      }
    }

    function resetMockData() {
      app.resetData();
    }

    // Initial render
    app.render();
  </script>
</body>
</html>
